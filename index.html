  // ---------- core ----------
  { p: "core", l: 1, q: "Define fuzzing and name its three essential ingredients.", a: "Fuzzing is automated testing that repeatedly generates inputs, executes the SUT on them and checks an oracle. The ingredients are an input generator or mutator, an execution harness for the target, and an oracle such as crashes or sanitizer reports.", k: ["generate many inputs", "run the SUT", "oracle (crash / ASAN)"] },
  { p: "core", l: 2, q: "What is the difference between mutation-based and generation-based fuzzing? Give an example of each from these papers.", a: "Mutation-based fuzzers modify existing seeds, like AFL++, AFLNet, GrayC, FOX and ChatAFL. Generation-based fuzzers build inputs from a grammar or model, like Csmith, YARPGen and BooFuzz. Mutation needs good seeds. Generation needs an expensive hand-written generator. Fuzz4All uses an LLM to do both.", k: ["mutate seeds vs synthesize from spec", "seed quality vs generator cost", "Fuzz4All mixes both"] },
  { p: "core", l: 2, q: "Why is code coverage used as feedback, and why is it only a proxy?", a: "You can't find a bug in code you never execute, so new coverage signals progress and tells the fuzzer which inputs to keep. But covering code doesn't mean triggering the bug inside it. That's why all three papers also report real bugs. FOX measures r = 0.88 between edges and crashes on xpdf.", k: ["can't find bugs in unexecuted code", "guides corpus", "coverage ≠ bugs", "papers also count bugs"] },
  { p: "core", l: 2, q: "Why do fuzzing papers run 10 × 24h trials and use Mann-Whitney U?", a: "Fuzzing is randomized, so single runs vary a lot. Repeated trials capture the distribution. Mann-Whitney U is non-parametric, so it makes no normality assumption, and it is the test recommended by Klees et al. for comparing randomized tools.", k: ["randomness", "distribution not normal", "non-parametric", "Klees et al."] },
  { p: "core", l: 1, q: "What is Vargha-Delaney Â12?", a: "An effect size: the probability that a randomly chosen run of tool A outperforms a randomly chosen run of tool B. 0.5 means no difference, and values near 1 mean A almost always wins. ChatAFL reports Â12 ≥ 0.86 for transitions over both baselines.", k: ["probability A beats B", "0.5 = equal", "effect size, not p-value"] },
  { p: "core", l: 2, q: "What is AFL++ cmplog and why is it a key baseline for FOX?", a: "cmplog intercepts the operands of comparison instructions and plants the expected values into the input. It's the industry implementation of REDQUEEN's input-to-state correspondence. FOX's branch-distance mutator also works from CMP operands, so AFLPP+C is its closest competitor.", k: ["intercept CMP operands", "REDQUEEN", "closest to FOX's mutator"] },

  // ---------- FOX ----------
  { p: "fox", l: 1, q: "What two limitations of existing coverage-guided fuzzers does FOX identify?", a: "Schedulers rely on coarse feedback that becomes sparse late in a campaign, so they degenerate to round-robin, and finer feedback causes seed explosion. Mutators are branch-agnostic and waste executions, while taint-based fixes are too expensive. On top of that, the scheduler and mutator don't share an objective.", k: ["sparse feedback → round-robin", "seed explosion", "branch-agnostic mutator", "taint overhead", "separate objectives"] },
  { p: "fox", l: 2, q: "Explain FOX's formulation of fuzzing as online stochastic control.", a: "The state is the corpus S_i. The control is the seed index u_i. The dynamics are x ← mut(S_i[u_i]), g_i = E[cov(x,S_i)], S_{i+1} ← update(S_i, x, g_i). The objective is to maximize Σ g_i over K stages subject to Σ t_i ≤ T. It's online because coverage is only seen after execution, and stochastic because the mutator is random and the program's response uncertain.", k: ["state = corpus", "control = seed choice", "stochastic dynamics", "maximize expected coverage", "time budget constraint"] },
  { p: "fox", l: 2, q: "How does FOX turn the coverage objective into something it can estimate?", a: "It writes coverage as a sum of Bernoulli indicators over unseen branches and uses linearity of expectation, so g_i is the sum of flip probabilities. Flip probabilities for unflipped branches can't be estimated from frequency, so it uses Pr(δ_b decreases), an upper bound because every flip implies a decrease. It restricts this to frontier branches, which are reached so their δ is observable.", k: ["indicators + linearity", "Pr(flip) ≤ Pr(δ decrease)", "frontier branches only"] },
  { p: "fox", l: 1, q: "Define frontier node and contrast it with a horizon node.", a: "A frontier node is a visited node with an edge to an unvisited node: F = {v | (v,u) ∈ E, v ∈ V, u ∈ U}. FOX keeps those that end in a conditional jump, the frontier branches. Horizon nodes, from K-Scheduler, are the unvisited nodes on that boundary.", k: ["visited", "edge into unvisited", "conditional jump", "horizon = unvisited side"] },
  { p: "fox", l: 2, q: "Walk me through computing a branch distance for `if (x <= 15)` with x = 5.", a: "f(x) = x − 15. Q is true and R is ≤, so Table 1 gives δ = 1 − f(x) = 16 − x. At x = 5, δ = 11. The root x = 16 makes the predicate false, which flips the branch. In the implementation an LLVM hook after the CMP records op1 − op2.", k: ["f(x)=x−15", "row (true, ≤) → 1−f", "δ=16−x", "root flips"] },
  { p: "fox", l: 3, q: "Is there anything odd about Table 1?", a: "The first row (false <, true ≥) is printed as f(x) − 1. The other five rows all reach δ = 0 exactly at the first flipping integer, and by that logic this row should be f(x) + 1. With f − 1, δ hits zero at f = 1, which doesn't satisfy f < 0. I'd quote the table as printed and point out the likely sign typo.", k: ["row 1 printed f−1", "consistency suggests f+1", "careful reading"] },
  { p: "fox", l: 2, q: "Describe FOX's scheduling algorithm and its probability estimate.", a: "For each frontier branch it keeps TS[b], the seed with the lowest branch distance. It picks the branch maximizing λ_b·pt(b)/tt(b): productive time over total time, discounted by the schedule count SC of that seed, computed as log PT − log TT − log SC to avoid underflow. Then it schedules TS[b].s and increments SC. The inner sum over branches is approximated by the max because most terms are near zero.", k: ["TS mapping", "PT/TT in time units", "SC decay", "log-prob", "max instead of sum"] },
  { p: "fox", l: 3, q: "Prove or sketch why the greedy scheduler is optimal. What assumptions does it rely on?", a: "It's an exchange argument. Take an optimal schedule and swap its first choice for the greedy one. With p ≤ p′ and q the best later probability, the difference in total expected gain is (p′ − p)(1 − q)^{n−1} ≥ 0. Repeat stage by stage. It assumes fixed flip probabilities known before each stage and access to the same estimates. In practice it depends on estimate accuracy, which the authors acknowledge.", k: ["exchange argument", "(p′−p)(1−q)^{n−1} ≥ 0", "fixed probabilities", "estimate accuracy caveat"] },
  { p: "fox", l: 2, q: "Explain local search and Newton's method in FOX's mutator.", a: "Local search samples k = 1024 havoc mutants with few stacked perturbations near the seed and computes g′ = Δδ ⊘ Δx for each. It keeps the max-L1-norm g, a subgradient that under-approximates δ locally. If g ≠ 0 it applies Newton: x − δ(x) ⊘ g. For linear δ that flips the branch in one step. For convex δ it likely reduces the distance.", k: ["k=1024", "reduced havoc stack", "max L1 subgradient", "under-approximation → stability", "x − δ/g"] },
  { p: "fox", l: 2, q: "How does FOX handle string comparisons?", a: "strcmp and strncmp are treated as multiple single-byte integer comparisons, with byte-wise distances and zero padding to equal length. To find which input bytes matter, it applies single byte-differences from a mutant to the seed and checks whether the distance changes. That gives hot bytes. Then it infers the rest from adjacency and the string length, without probing every byte.", k: ["byte-wise δ", "single-byte probes", "hot bytes", "adjacency inference"] },
  { p: "fox", l: 1, q: "What are FOX's headline results?", a: "Over AFL++: +26.45% edges on 15 standalone programs (16.98% over AFLPP+C, 12.90% over AFLPP+CD) and up to +6.59% on 23 FuzzBench programs. Up to 16.16% more Magma bugs. FOX+D found 20 unique bugs, 8 previously unknown in xpdf. Control space down 58.20% at 24h. 33.99% more frontier branches flipped.", k: ["26.45%", "6.59%", "20 bugs / 8 new", "58.20%", "33.99%"] },
  { p: "fox", l: 2, q: "Why did FOX add 15 standalone programs instead of using only FuzzBench?", a: "Many FuzzBench harnesses are small (about a third have under 20,000 edges) or come with many test cases, so coverage saturates early and fuzzers become hard to tell apart. In SBFT'23 the winner beat AFLPP+CD by only 1.28%. Large standalone programs from prior work show differences more clearly.", k: ["FuzzBench saturates", "<20k edges", "SBFT'23 1.28%", "real-world diversity"] },
  { p: "fox", l: 2, q: "What does FOX's ablation show?", a: "On 15 standalone programs over 10 × 1h: FOX-BASE has neither component, FOX-SCHED the scheduler only, FOX both. Full FOX gets +20.07% over BASE and +9.23% over SCHED, so both contribute. The scheduler alone gives up to 27.2% (pdftotext, except xmllint). Newton gives up to 31.9% (except tiff2ps, which is non-convex).", k: ["BASE/SCHED/FULL", "20.07%", "9.23%", "exceptions xmllint, tiff2ps"] },
  { p: "fox", l: 3, q: "What are FOX's limitations and how would you address them?", a: "Non-convex branches (checksums, hashes, complex strings) defeat Newton. Floating-point and variable-variable string compares are unsupported. Havoc isn't adaptive as a sampler. Estimates can be wrong, and pathological branches can trap the scheduler. Fixes: use costlier solvers such as checksum-aware or concolic methods only for hard branches, use an adaptive local-search mutator, and re-weight branches that keep decreasing without flipping.", k: ["non-convex", "float / var-var strings", "havoc sampler", "pathological branches", "concrete fixes"] },

          crash();          <span class="c">// heap overflow!</span>
  <span class="k">return</span> 0;
}</div>
    <div class="panel stack">
      <div class="eyebrow">Current input</div>
      <div class="bytes" id="ml-bytes"></div>
      <div class="row">
        <button class="btn sm" id="ml-bit">Flip a random bit</button>
        <button class="btn sm" id="ml-byte">Random byte</button>
        <button class="btn sm" id="ml-havoc">Havoc (stack 3)</button>
        <button class="btn sm ghost" id="ml-reset">Reset to seed</button>
      </div>
      <div class="small muted" id="ml-manual">Each tap mutates the input and runs it once. Byte values are random over all 256 values, as in a real fuzzer.</div>
    </div>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:8px">Edge coverage (bitmap)</div>
      <div class="row" id="ml-cov"></div>
    </div>
    <div class="stack">
      <div class="eyebrow">Automatic fuzzing · 40,000 executions</div>
      <div class="grid2">
        <button class="btn" id="ml-blind">Blind run</button>
        <button class="btn primary" id="ml-guided">Coverage-guided run</button>
      </div>
      <div class="kv panel"><span>Executions</span><b id="ml-execs">0</b><span>Corpus size</span><b id="ml-corp">1 (seed)</b><span>Deepest edge</span><b id="ml-deep">none</b></div>
      <div class="log" id="ml-log"><span class="dim">Seed corpus: "FUZZ"</span></div>
    </div>
  </div>`;
  let cur = SEED.split("").map(c => c.charCodeAt(0));
  const covSeen = new Set();
  const show = (bytes, changed = []) => {
    U.$(root, "#ml-bytes").innerHTML = bytes.map((b, i) => {
      const ch = b >= 32 && b < 127 ? U.esc(String.fromCharCode(b)) : "\\x" + b.toString(16).padStart(2, "0");
      const ok = b === TARGET.charCodeAt(i) && depth(bytes) > i;
      return `<span class="${changed.includes(i) ? "chg" : ""} ${ok ? "ok" : ""}">${ch}</span>`;
    }).join("");
  };
  const depth = (b) => { let d = 0; while (d < 4 && b[d] === TARGET.charCodeAt(d)) d++; return d; };
  const drawCov = (set) => {
    U.$(root, "#ml-cov").innerHTML = ["e1", "e2", "e3", "e4"].map((e, i) =>
      `<span class="pill ${set.has(i + 1) ? "good" : ""}">${e} ${set.has(i + 1) ? "■" : "□"}</span>`).join("") +
      (set.has(4) ? `<span class="pill bad">CRASH</span>` : "");
  };
  const mutate = (bytes, kind) => {
    const b = bytes.slice(), changed = [];
    const one = () => {
      const i = U.ri(0, b.length - 1); changed.push(i);
      if (kind === "bit") b[i] ^= 1 << U.ri(0, 7); else b[i] = U.ri(0, 255);
    };
    if (kind === "havoc") { const n = U.ri(1, 3); for (let k = 0; k < n; k++) { kind = U.pick(["bit", "byte"]); one(); } }
    else one();
    return { b, changed };
  };
  const manual = (kind) => {
    const { b, changed } = mutate(cur, kind); cur = b;
    const d = depth(cur); for (let i = 1; i <= d; i++) covSeen.add(i);
    show(cur, changed); drawCov(covSeen);
    U.$(root, "#ml-manual").textContent = d === 4 ? "You crashed it by hand. Lucky!" : `Ran once: reached ${d ? "e" + d : "no new edge"}. Doing this by hand doesn't scale, so try the automatic runs below.`;
    if (d === 4) api.done();
  };
  U.$(root, "#ml-bit").onclick = () => manual("bit");
  U.$(root, "#ml-byte").onclick = () => manual("byte");
  U.$(root, "#ml-havoc").onclick = () => manual("havoc");
  U.$(root, "#ml-reset").onclick = () => { cur = SEED.split("").map(c => c.charCodeAt(0)); show(cur); };
  show(cur); drawCov(covSeen);

  let running = false;
  const run = (guided) => {
    if (running) return; running = true;
    const log = U.$(root, "#ml-log"); log.innerHTML = "";
    const seed = SEED.split("").map(c => c.charCodeAt(0));
    const corpus = [seed]; const cov = new Set(); let execs = 0, rr = 0, found = false, best = 0;
    const L = (html) => { log.insertAdjacentHTML("beforeend", html + "\n"); log.scrollTop = log.scrollHeight; };
    L(`<span class="dim">${guided ? "Coverage-guided" : "Blind"} campaign started. Seed "FUZZ".</span>`);
    const step = () => {
      for (let k = 0; k < 500 && execs < 40000 && !found; k++) {
        const parent = guided ? corpus[rr++ % corpus.length] : seed;
        const { b } = mutate(parent, "havoc"); execs++;
        const d = depth(b);
        let isNew = false; for (let i = 1; i <= d; i++) if (!cov.has(i)) { cov.add(i); isNew = true; }
        if (d > best) best = d;
        if (d === 4) { found = true; L(`<span class="bad">exec ${U.fmt(execs)}: CRASH with "${String.fromCharCode(...b)}". Saved to crashes/.</span>`); show(b); }
        else if (isNew && guided) { corpus.push(b); L(`<span class="good">exec ${U.fmt(execs)}: new edge e${d}, kept "${b.map(x => x >= 32 && x < 127 ? String.fromCharCode(x) : "·").join("")}"</span>`); }
      }
      U.$(root, "#ml-execs").textContent = U.fmt(execs);
      U.$(root, "#ml-corp").textContent = guided ? corpus.length : "1 (never grows)";
      U.$(root, "#ml-deep").textContent = best ? "e" + best : "none";
      drawCov(cov);
      if (!found && execs < 40000) requestAnimationFrame(step);
      else {
        running = false;
        if (!found) L(`<span class="warn">Budget spent. No crash. Blind fuzzing must guess all 4 bytes at once: about 1 in 256⁴ ≈ 4.3 billion.</span>`);
        else if (guided) { L(`<span class="good">Each correct byte was rewarded and kept, so the fuzzer only had to guess one byte at a time (about 1 in 1,024 per step).</span>`); api.done(); }
      }
    };
    requestAnimationFrame(step);
  };
  U.$(root, "#ml-blind").onclick = () => run(false);
  U.$(root, "#ml-guided").onclick = () => run(true);
};

/* =====================================================================
   FOX · Frontier Finder
   ===================================================================== */
G.frontierFinder = function (root, api) {
  const LEVELS = [
    { name: "if / else", nodes: { A: [150, 30], B: [80, 120], C: [220, 120], D: [40, 220], E: [130, 220], F: [220, 220] },
      edges: [["A", "B"], ["A", "C"], ["B", "D"], ["B", "E"], ["C", "F"]], visited: ["A", "B", "C", "D"] },
    { name: "diamond + join", nodes: { A: [150, 25], B: [150, 95], C: [80, 165], D: [220, 165], E: [150, 235], F: [80, 305], G: [220, 305], H: [150, 370] },
      edges: [["A", "B"], ["B", "C"], ["B", "D"], ["C", "E"], ["D", "E"], ["E", "F"], ["E", "G"], ["F", "H"], ["G", "H"]], visited: ["A", "B", "C", "E", "F", "H"] },
    { name: "a real-looking parser", nodes: { A: [150, 22], B: [70, 90], C: [230, 90], D: [30, 165], E: [110, 165], F: [190, 165], G: [270, 165], H: [70, 245], I: [150, 245], J: [230, 245], K: [110, 320], L: [190, 320] },
      edges: [["A", "B"], ["A", "C"], ["B", "D"], ["B", "E"], ["C", "F"], ["C", "G"], ["E", "H"], ["E", "I"], ["F", "I"], ["F", "J"], ["H", "K"], ["I", "K"], ["I", "L"], ["J", "L"]],
      visited: ["A", "B", "C", "D", "E", "F", "I", "K"] }
  ];
  let lv = 0, found = new Set();
  root.innerHTML = `<div class="sim">
    <div class="row"><span class="pill" id="ff-lv"></span><span class="pill" id="ff-cnt"></span></div>
    <div class="legend"><span><i style="background:var(--ink)"></i>visited (V)</span><span><i style="border:2px solid var(--muted);background:transparent"></i>unvisited (U)</span><span><i style="background:var(--fox)"></i>frontier you found</span></div>
    <svg id="ff-svg" viewBox="0 0 300 400" style="max-height:440px"></svg>
    <div class="panel small" id="ff-msg">Tap a node.</div>
    <div class="row"><button class="btn sm" id="ff-hint">Hint</button><button class="btn sm primary" id="ff-next" hidden>Next level</button></div>
  </div>`;
  const svg = U.$(root, "#ff-svg");
  const frontier = (L) => {
    const V = new Set(L.visited);
    return new Set(L.edges.filter(([a, b]) => V.has(a) && !V.has(b)).map(([a]) => a));
  };
  const draw = () => {
    const L = LEVELS[lv], V = new Set(L.visited), F = frontier(L);
    let s = `<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>`;
    L.edges.forEach(([a, b]) => {
      const [x1, y1] = L.nodes[a], [x2, y2] = L.nodes[b];
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
      const ux = dx / len, uy = dy / len;
      const taken = V.has(a) && V.has(b);
      s += `<line x1="${x1 + ux * 17}" y1="${y1 + uy * 17}" x2="${x2 - ux * 19}" y2="${y2 - uy * 19}" stroke="${taken ? "var(--ink)" : "var(--muted)"}" stroke-width="${taken ? 2.2 : 1.4}" stroke-dasharray="${taken ? "" : "4 4"}" marker-end="url(#ar)"/>`;
    });
    Object.entries(L.nodes).forEach(([n, [x, y]]) => {
      const v = V.has(n), f = found.has(n);
      s += `<g data-n="${n}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="22" fill="transparent"/>
        <circle cx="${x}" cy="${y}" r="16" fill="${f ? "var(--fox)" : v ? "var(--ink)" : "var(--paper)"}" stroke="${v ? "var(--ink)" : "var(--muted)"}" stroke-width="2"/>
        <text x="${x}" y="${y + 5}" text-anchor="middle" font-family="var(--f-mono)" font-size="14" font-weight="700" fill="${v || f ? "var(--paper)" : "var(--muted)"}">${n}</text></g>`;
    });
    svg.innerHTML = s;
    U.$(root, "#ff-lv").textContent = `Level ${lv + 1}/3 · ${L.name}`;
    U.$(root, "#ff-cnt").textContent = `${found.size}/${F.size} frontier nodes`;
    U.$$(svg, "g[data-n]").forEach(g => g.onclick = () => tap(g.dataset.n));
  };
  const tap = (n) => {
    const L = LEVELS[lv], V = new Set(L.visited), F = frontier(L), msg = U.$(root, "#ff-msg");
    if (found.has(n)) return;
    if (F.has(n)) {
      found.add(n);
      const outs = L.edges.filter(([a, b]) => a === n && !V.has(b)).map(e => e[1]);
      msg.innerHTML = `<b>${n} is a frontier node.</b> It is visited and has an edge into unvisited ${outs.join(", ")}. Its conditional jump is a frontier branch: flip it and you gain new coverage.`;
    } else if (!V.has(n)) {
      const fromV = L.edges.some(([a, b]) => b === n && V.has(a));
      msg.innerHTML = fromV ? `<b>${n} is unvisited.</b> It sits on the boundary, which makes it a <em>horizon node</em> in K-Scheduler's terms. FOX's frontier is the <em>visited</em> parent that leads here.` :
        `<b>${n} is unvisited and deep in unexplored code.</b> FOX can't measure a branch distance for it, because its comparison never executes.`;
    } else {
      msg.innerHTML = `<b>${n} is visited, but every outgoing edge already leads to visited code.</b> It's fully explored, so FOX's adaptive switch turns its hook off.`;
    }
    draw();
    if (found.size === F.size) {
      if (lv < LEVELS.length - 1) { U.$(root, "#ff-next").hidden = false; msg.innerHTML += `<br><b>Level cleared.</b>`; }
      else { msg.innerHTML += `<br><b>All levels cleared.</b> Notice how small the frontier is compared with the whole graph. That's why FOX's control space stays compact.`; api.done(); }
    }
  };
  U.$(root, "#ff-next").onclick = () => { lv++; found = new Set(); U.$(root, "#ff-next").hidden = true; U.$(root, "#ff-msg").textContent = "Tap a node."; draw(); };
  U.$(root, "#ff-hint").onclick = () => { U.$(root, "#ff-msg").innerHTML = `Rule: F = { v | (v,u) ∈ E, v ∈ V, u ∈ U }. Look for a <b>filled</b> node with a <b>dashed</b> arrow leaving it.`; };
  draw();
};

/* =====================================================================
   FOX · Branch Distance Dial
   ===================================================================== */
G.branchDial = function (root, api) {
  const BR = [
    { code: "if (x <= 15)", c: 15, R: "≤", x0: 5 },
    { code: "if (x == 42)", c: 42, R: "=", x0: 200 },
    { code: "if (x > 200)", c: 200, R: ">", x0: 50 },
    { code: "if (x != 7)", c: 7, R: "≠", x0: 7 },
    { code: "if (x < 100)", c: 100, R: "<", x0: 150 }
  ];
  const holds = (R, f) => ({ "<": f < 0, "≤": f <= 0, ">": f > 0, "≥": f >= 0, "=": f === 0, "≠": f !== 0 })[R];
  // Table 1 exactly as printed in the paper
  const table1 = (Q, R) => {
    const key = (Q ? "T" : "F") + R;
    const map = { "F<": ["f(x) − 1", f => f - 1], "T≥": ["f(x) − 1", f => f - 1], "F≤": ["f(x)", f => f], "T>": ["f(x)", f => f],
      "F>": ["1 − f(x)", f => 1 - f], "T≤": ["1 − f(x)", f => 1 - f], "F≥": ["−f(x)", f => -f], "T<": ["−f(x)", f => -f],
      "F=": ["|f(x)|", f => Math.abs(f)], "T≠": ["|f(x)|", f => Math.abs(f)], "F≠": ["1 − |f(x)|", f => 1 - Math.abs(f)], "T=": ["1 − |f(x)|", f => 1 - Math.abs(f)] };
    return map[key];
  };
  let bi = 0, x = BR[0].x0; const flipped = new Set();
  root.innerHTML = `<div class="sim">
    <div class="chips" id="bd-chips"></div>
    <div class="codeblock" id="bd-code"></div>
    <canvas id="bd-cv"></canvas>
    <label class="small muted" for="bd-x">Input x</label>
    <input type="range" id="bd-x" min="0" max="255" step="1">
    <div class="kv panel" id="bd-kv"></div>
    <div class="panel small" id="bd-msg"></div>
    <div class="small muted" id="bd-prog"></div>
  </div>`;
  const chips = U.$(root, "#bd-chips");
  chips.innerHTML = BR.map((b, i) => `<button class="chip" data-i="${i}">${U.esc(b.code)}</button>`).join("");
  U.$$(chips, "button").forEach(bt => bt.onclick = () => { bi = +bt.dataset.i; x = BR[bi].x0; U.$(root, "#bd-x").value = x; render(); });
  const slider = U.$(root, "#bd-x");
  slider.oninput = () => { x = +slider.value; render(); };
  const render = () => {
    const b = BR[bi], f = x - b.c, Q0 = holds(b.R, b.x0 - b.c), Q = holds(b.R, f);
    const [name, fn] = table1(Q0, b.R), d = fn(f), flip = Q !== Q0;
    if (flip) flipped.add(bi);
    U.$$(chips, "button").forEach((bt, i) => bt.classList.toggle("on", i === bi));
    U.$(root, "#bd-code").innerHTML = `<span class="k">${U.esc(b.code)}</span>    <span class="c">// f(x) = x − ${b.c},  R = ${b.R}</span>\n<span class="c">// reaching seed: x = ${b.x0}, so Q₀ = ${Q0}</span>`;
    slider.value = x;
    U.$(root, "#bd-kv").innerHTML = `<span>x</span><b>${x}</b><span>f(x)</span><b>${f}</b><span>Q now</span><b>${Q}</b><span>Table 1 row</span><b>(${Q0}, ${b.R}) → δ = ${name}</b><span>δ(x)</span><b style="color:${d <= 0 ? "var(--cov)" : "var(--ink)"}">${d}</b><span>Branch</span><b style="color:${flip ? "var(--cov)" : "var(--muted)"}">${flip ? "FLIPPED: new edge!" : "not flipped"}</b>`;
    let msg = flip ? `Flipped. The other outgoing edge executes, which is new coverage.` : `Drag x so that δ falls to 0. Lower δ means closer to flipping.`;
    if (b.R === "<" && !flip && d <= 0) msg = `δ = ${d} but the branch has <b>not</b> flipped. The printed row says δ = f(x) − 1, which reaches 0 at x = 101, while x &lt; 100 needs x ≤ 99. With f(x) + 1 the root would be exactly x = 99, consistent with the other five rows. It looks like a typo in the table, and spotting it is a good viva point.`;
    if (b.R === "<" && flip) msg = `Flipped at x = ${x}. Note that δ = ${d} here, not 0. The printed formula f(x) − 1 is off by 2 for this row (f(x) + 1 would give 0 at x = 99).`;
    U.$(root, "#bd-msg").innerHTML = msg;
    U.$(root, "#bd-prog").textContent = `Branches flipped: ${flipped.size}/5`;
    if (flipped.size >= 3) api.done();
    // plot
    const cv = U.$(root, "#bd-cv"), ctx = U.canvas(cv, 170), W = ctx.W, H = ctx.H, pad = 28;
    const vals = []; for (let t = 0; t <= 255; t++) vals.push(fn(t - b.c));
    const lo = Math.min(-5, ...vals), hi = Math.max(5, ...vals);
    const X = t => pad + (t / 255) * (W - pad - 8), Y = v => 10 + (1 - (v - lo) / (hi - lo)) * (H - 30);
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = U.css("--line"); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(pad, Y(0)); ctx.lineTo(W - 8, Y(0)); ctx.stroke();
    ctx.fillStyle = U.css("--muted"); ctx.font = "11px " + U.css("--f-mono"); ctx.fillText("δ=0", 2, Y(0) + 4); ctx.fillText("0", pad - 4, H - 4); ctx.fillText("255", W - 30, H - 4);
    // flipped region shading
    ctx.fillStyle = U.css("--cov") + "22";
    for (let t = 0; t <= 255; t++) if (holds(b.R, t - b.c) !== Q0) ctx.fillRect(X(t) - 0.6, 10, (W - pad - 8) / 255 + 1.2, H - 30);
    ctx.strokeStyle = U.css("--fox"); ctx.lineWidth = 2; ctx.beginPath();
    vals.forEach((v, t) => t ? ctx.lineTo(X(t), Y(v)) : ctx.moveTo(X(t), Y(v))); ctx.stroke();
    ctx.fillStyle = U.css("--ink"); ctx.beginPath(); ctx.arc(X(x), Y(d), 5, 0, 7); ctx.fill();
  };
  render();
  window.addEventListener("resize", render, { passive: true });
};

/* =====================================================================
   FOX · Scheduler Showdown
   ===================================================================== */
G.schedulerShowdown = function (root, api) {
  const BUDGET = 60;
  let patho = false, world, manual;
  root.innerHTML = `<div class="sim">
    <div class="row"><span class="pill" id="ss-time"></span><span class="pill good" id="ss-flips"></span>
      <label class="small row" style="gap:6px"><input type="checkbox" id="ss-patho"> include a pathological branch</label></div>
    <div class="scrollx"><table class="data" id="ss-tab"></table></div>
    <div class="small muted">Tap <b>Schedule</b> on a branch to spend its seed's execution time on a local-search round. Score is FOX's log PT − log TT − log SC. Higher means more promising.</div>
    <div class="log" id="ss-log"></div>
    <div class="row"><button class="btn sm" id="ss-auto">Let FOX pick this stage</button><button class="btn sm ghost" id="ss-new">New world</button></div>
    <div class="panel" id="ss-result" hidden></div>
  </div>`;
  const mkWorld = (seed) => {
    const r = U.rng(seed);
    const mk = (id) => ({ id, p: [0.06, 0.15, 0.3, 0.5, 0.75][Math.floor(r() * 5)], need: 2 + Math.floor(r() * 4), t: 1 + Math.floor(r() * 3), gain: 3 + Math.floor(r() * 12), seed: Math.floor(r() * 1e9) });
    const bs = []; for (let i = 0; i < 5; i++) bs.push(mk("B" + (i + 1)));
    const spares = []; for (let i = 0; i < 30; i++) spares.push(mk("B" + (i + 6)));
    if (patho) { bs[4] = { id: "B5", p: 0.8, need: Infinity, t: 1, gain: 0, seed: Math.floor(r() * 1e9), patho: true }; }
    return { bs, spares };
  };
  // simulate one strategy on a world; returns {flips, cov, log}
  const makeState = (w) => ({ time: 0, flips: 0, cov: 0, sp: 0, rr: 0, bs: w.bs.map(b => ({ ...b, rng: U.rng(b.seed), pt: 0, tt: 0, sc: 1, dec: 0, hits: 0 })), spares: w.spares });
  const score = (b) => Math.log(b.pt + 0.5) - Math.log(b.tt + 1) - Math.log(b.sc);
  const stepState = (S, idx) => {
    const b = S.bs[idx]; S.time += b.t; b.tt += b.t; b.sc += 1; b.hits++;
    const decreased = b.rng() < b.p; let flipped = false;
    if (decreased) { b.pt += b.t; b.dec++; if (b.dec >= b.need) flipped = true; }
    let out = { b: b.id, decreased, flipped, gain: b.gain };
    if (flipped) { S.flips++; S.cov += b.gain; const nb = S.spares[S.sp++ % S.spares.length]; S.bs[idx] = { ...nb, rng: U.rng(nb.seed), pt: 0, tt: 0, sc: 1, dec: 0, hits: 0 }; }
    return out;
  };
  const autoRun = (w, strat) => {
    const S = makeState(w);
    while (S.time < BUDGET) {
      let idx;
      if (strat === "rr") idx = S.rr++ % S.bs.length;
      else { idx = 0; let best = -Infinity; S.bs.forEach((b, i) => { const s = score(b); if (s > best) { best = s; idx = i; } }); }
      if (S.time + S.bs[idx].t > BUDGET) break;
      stepState(S, idx);
    }
    return S;
  };
  const newWorld = () => {
    const seed = Math.floor(Math.random() * 1e9); world = mkWorld(seed); manual = makeState(world);
    U.$(root, "#ss-log").innerHTML = `<span class="dim">New world. Five frontier branches with hidden difficulty and seed speed.</span>\n`;
    U.$(root, "#ss-result").hidden = true; render();
  };
  const render = () => {
    const S = manual;
    U.$(root, "#ss-time").textContent = `time ${S.time}/${BUDGET}`;
    U.$(root, "#ss-flips").textContent = `flips ${S.flips} · +${S.cov} edges`;
    U.$(root, "#ss-tab").innerHTML = `<tr><th>Branch</th><th class="num">t/run</th><th class="num">PT</th><th class="num">TT</th><th class="num">SC</th><th class="num">TS[b].d</th><th class="num">score</th><th></th></tr>` +

/* =====================================================================

G.newtonLeap = function (root, api) {
  const MAXX = 1023;
  const MODES = {
    linear: { label: "Linear: if (3*x + 17 == 2000)", f: x => 3 * x + 17 - 2000, flip: x => 3 * x + 17 === 2000, x0: 120 },
    convex: { label: "Convex-ish: if (x*x/64 + x > 9000)", f: x => x * x / 64 + x - 9000, flip: x => x * x / 64 + x > 9000, x0: 200 },
    hash: { label: "Non-convex: if (crc8(x) == 0x5A)", f: x => crc(x) - 0x5A, flip: x => crc(x) === 0x5A, x0: 300 }
  };
  function crc(x) { let c = x & 0xff ^ (x >> 8) * 0x1d; for (let i = 0; i < 8; i++) c = c & 0x80 ? ((c << 1) ^ 0x07) & 0xff : (c << 1) & 0xff; return c; }
  let mode = "linear", x, samples = [], g = null, tries = 0, steps = 0, newtonFlips = 0, mpPass = 0, mpTot = 0;
  const deltaOf = (m, x) => { const v = MODES[m].f(x); if (m === "linear" || m === "hash") return Math.abs(v); return 1 - v; }; // = : |f| ; > (false) : 1 - f
  root.innerHTML = `<div class="sim">
    <div class="chips" id="nl-chips">${Object.entries(MODES).map(([k, v]) => `<button class="chip" data-m="${k}">${k}</button>`).join("")}</div>
    <div class="codeblock" id="nl-code"></div>
    <canvas id="nl-cv"></canvas>
    <div class="legend"><span><i style="background:var(--fox)"></i>δ(x)</span><span><i style="background:var(--boot)"></i>local-search samples</span><span><i style="background:var(--cov)"></i>linear model g → root</span></div>
    <div class="kv panel" id="nl-kv"></div>
    <div class="grid2">
      <button class="btn" id="nl-havoc">Random havoc ×100</button>
      <button class="btn" id="nl-ls">Local search (k=32)</button>
    </div>
    <button class="btn primary" id="nl-newton" disabled>Newton step: x − δ/g</button>
    <div class="panel small" id="nl-msg"></div>
  </div>`;
  const reset = () => { x = MODES[mode].x0; samples = []; g = null; tries = 0; steps = 0; mpPass = 0; mpTot = 0; U.$(root, "#nl-newton").disabled = true; msg(""); render(); };
  const msg = (h) => U.$(root, "#nl-msg").innerHTML = h || (mode === "hash" ? "This branch compares a checksum. Try local search and Newton and see what happens." : "Run local search to estimate the slope, then take a Newton step.");
  const render = () => {
    U.$$(root, "#nl-chips button").forEach(b => b.classList.toggle("on", b.dataset.m === mode));
    const M = MODES[mode];
    U.$(root, "#nl-code").innerHTML = `<span class="k">${U.esc(M.label)}</span>\n<span class="c">// Q₀ = false, so δ = ${mode === "convex" ? "1 − f(x)  (row: false, >)" : "|f(x)|  (row: false, =)"}</span>`;
    const d = deltaOf(mode, x);
    U.$(root, "#nl-kv").innerHTML = `<span>x</span><b>${x}</b><span>δ(x)</span><b>${Number.isInteger(d) ? d : d.toFixed(1)}</b><span>subgradient g</span><b>${g === null ? "n/a" : g.toFixed(3)}</b><span>havoc tries</span><b>${U.fmt(tries)}</b><span>Newton steps</span><b>${steps}</b>${mpTot ? `<span>midpoint-convex</span><b>${mpPass}/${mpTot} sample pairs</b>` : ""}<span>status</span><b style="color:${M.flip(x) ? "var(--cov)" : "var(--muted)"}">${M.flip(x) ? "FLIPPED" : "not flipped"}</b>`;
    const cv = U.$(root, "#nl-cv"), ctx = U.canvas(cv, 190), W = ctx.W, H = ctx.H, pad = 8;
    const vals = []; for (let t = 0; t <= MAXX; t += 1) vals.push(deltaOf(mode, t));
    let lo = Math.min(0, ...vals), hi = Math.max(...vals); if (hi - lo < 1) hi = lo + 1;
    const X = t => pad + (t / MAXX) * (W - 2 * pad), Y = v => 8 + (1 - (v - lo) / (hi - lo)) * (H - 22);
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = U.css("--line"); ctx.beginPath(); ctx.moveTo(pad, Y(0)); ctx.lineTo(W - pad, Y(0)); ctx.stroke();
    ctx.strokeStyle = U.css("--fox"); ctx.lineWidth = mode === "hash" ? 1 : 2; ctx.beginPath();
    vals.forEach((v, t) => t ? ctx.lineTo(X(t), Y(v)) : ctx.moveTo(X(t), Y(v))); ctx.stroke();

    samples = []; render();
  };
  reset();
  window.addEventListener("resize", render, { passive: true });
};

G.hotBytes = function (root, api) {
  const TARGET = "FOX!", OFF = 3;
  let inp = "HDRabcdEND".split("").map(c => c.charCodeAt(0));
  const hot = new Set(), probed = new Set(); let inferred = false, solved = false, probes = 0;
  root.innerHTML = `<div class="sim">
    <div class="codeblock"><span class="c">// target</span>
<span class="k">if</span> (strncmp(buf + 3, <span class="s">"FOX!"</span>, 4) == 0) bug();
<span class="c">// FOX sees op1 = bytes of buf+3.., op2 = "FOX!" → δ[i] = op1[i] − op2[i]</span></div>
    <div class="eyebrow">Input bytes (tap one to probe it with a single-byte change)</div>
    <div class="bytes" id="hb-in"></div>
    <div class="eyebrow">Byte-wise branch distances δ[0..3]</div>
    <div class="bytes" id="hb-d"></div>
    <div class="row"><button class="btn sm" id="hb-infer" disabled>Infer the other hot bytes</button><button class="btn sm primary" id="hb-solve" disabled>Newton on every hot byte</button></div>
    <div class="panel small" id="hb-msg">Probing every byte, as taint-style approaches do, costs one execution per byte. Find a single hot byte, then use adjacency.</div>
  </div>`;
  const dist = () => TARGET.split("").map((c, i) => inp[OFF + i] - c.charCodeAt(0));
  const render = (changedIdx = -1, dchg = []) => {
    U.$(root, "#hb-in").innerHTML = inp.map((b, i) => `<span data-i="${i}" class="${hot.has(i) ? "hot" : ""} ${i === changedIdx ? "chg" : ""} ${solved && hot.has(i) ? "ok" : ""}" style="cursor:pointer">${U.esc(String.fromCharCode(b))}<br><small class="muted">${i}</small></span>`).join("");
    U.$(root, "#hb-d").innerHTML = dist().map((d, i) => `<span class="${dchg.includes(i) ? "chg" : ""} ${d === 0 ? "ok" : ""}">${d}</span>`).join("");
    U.$$(root, "#hb-in span").forEach(s => s.onclick = () => probe(+s.dataset.i));
  };
  const probe = (i) => {
    if (solved) return;
    const before = dist(); const save = inp[i]; inp[i] = (inp[i] + 1) & 0xff; probes++; probed.add(i);
    const after = dist(); const chg = after.map((d, k) => d !== before[k] ? k : -1).filter(k => k >= 0);
    render(i, chg); inp[i] = save;
    const m = U.$(root, "#hb-msg");
    if (chg.length) {
      hot.add(i); const j = chg[0];
      m.innerHTML = `Probe ${probes}: changing byte ${i} moved δ[${j}]. <b>Byte ${i} is hot</b> and maps to string position ${j}. The compared string has length 4, so the string starts at byte ${i - j}.`;
      U.$(root, "#hb-infer").disabled = false; U.$(root, "#hb-infer").dataset.start = i - j;
    } else m.innerHTML = `Probe ${probes}: byte ${i} changed nothing in δ, so it's not hot.`;
    setTimeout(() => render(), 650);
  };
  U.$(root, "#hb-infer").onclick = (e) => {
    const s = +e.target.dataset.start; for (let k = 0; k < 4; k++) hot.add(s + k); inferred = true;
    U.$(root, "#hb-solve").disabled = false; e.target.disabled = true;
    U.$(root, "#hb-msg").innerHTML = `Inferred hot bytes ${s}–${s + 3} from adjacency, after <b>${probes}</b> probe${probes > 1 ? "s" : ""} instead of ${inp.length}. That is FOX's shortcut: "hot bytes for a string comparison are typically adjacent."`;
    render();
  };
  U.$(root, "#hb-solve").onclick = () => {
    const d = dist(); [...hot].sort((a, b) => a - b).forEach((i, k) => { inp[i] = inp[i] - d[k]; }); // slope 1 each → x - δ/1
    solved = true; render();
    U.$(root, "#hb-msg").innerHTML = `Each byte comparison is linear with slope g = 1, so Newton gives x − δ/1 for every byte at once. Input is now "${String.fromCharCode(...inp)}". <b>strncmp == 0, branch flipped.</b>`;
    U.$(root, "#hb-solve").disabled = true; api.done();
  };
  render();
};

      d = `M${sx},${sy} L${ex},${ey}`; lx = (sx + ex) / 2 + nx * 11; ly = (sy + ey) / 2 + ny * 11 + 3;
    }
    s += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${seen ? 2.4 : 1.3}" marker-end="url(#${seen ? "arrc" : "arr"})"/>`;
    s += `<text x="${lx}" y="${ly}" text-anchor="middle" font-size="9" font-family="var(--f-mono)" fill="${col}">${lbl}</text>`;
  });
  Object.entries(P).forEach(([n, [x, y]]) => {
    const on = n === cur;
    s += `<rect x="${x - 34}" y="${y - 18}" width="68" height="36" rx="10" fill="${on ? "var(--chat)" : "var(--paper)"}" stroke="${on ? "var(--chat)" : "var(--line)"}" stroke-width="2"/>
      <text x="${x}" y="${y + 5}" text-anchor="middle" font-size="12.5" font-weight="700" font-family="var(--f-mono)" fill="${on ? "var(--paper)" : "var(--ink)"}">${n}</text>`;
  });
  return s;
}

/* =====================================================================
   ChatAFL · Live555 Simulator
   ===================================================================== */
G.rtspServer = function (root, api) {
  let state = "INIT", session = null, cseq = 1, pausedFromPlay = false, crashed = false;
  const codes = new Set(), trans = new Set();
  root.innerHTML = `<div class="sim">
    <svg id="rs-svg" viewBox="0 0 350 215"></svg>
    <div class="row"><span class="pill" id="rs-st"></span><span class="pill good" id="rs-cov"></span></div>
    <div class="row small">
      <label class="row" style="gap:6px"><input type="checkbox" id="rs-sess" checked> copy Session ID from server reply</label>
      <label class="row" style="gap:6px"><input type="checkbox" id="rs-byte"> byte-mutate the next message</label>
      <label class="row" style="gap:6px"><input type="checkbox" id="rs-rfc"> strict RFC (pretend ANNOUNCE/RECORD work)</label>
    </div>
    <div class="msgbtns" id="rs-btns">${TYPES.map(t => `<button class="btn" data-t="${t}">${t}</button>`).join("")}</div>
    <div class="log" id="rs-log"><span class="dim">Server listening on rtsp://127.0.0.1:8554. State INIT.</span>\n</div>
    <div class="row"><button class="btn sm ghost" id="rs-reset">Restart server</button></div>
    <div class="callout small">Goal: reproduce <b>bug #1</b>. The response codes here are illustrative (RFC 2326 style). In AFLNet each distinct code counts as a state.</div>
  </div>`;
  const L = (h) => { const lg = U.$(root, "#rs-log"); lg.insertAdjacentHTML("beforeend", h + "\n"); lg.scrollTop = lg.scrollHeight; };
  const render = () => {
    U.$(root, "#rs-svg").innerHTML = stateSVG(state, trans);
    U.$(root, "#rs-st").textContent = `state ${state}${session ? " · Session " + session : ""}`;
    U.$(root, "#rs-cov").textContent = `codes seen ${codes.size} · transitions ${trans.size}/8`;
  };
  const send = (m) => {
    if (crashed) return;
    const byte = U.$(root, "#rs-byte").checked, rfc = U.$(root, "#rs-rfc").checked, useS = U.$(root, "#rs-sess").checked;
    let line = `${m} rtsp://127.0.0.1:8554/aacAudioTest/ RTSP/1.0`;
    if (byte) { const arr = line.split(""); const i = U.ri(0, Math.min(arr.length - 1, 30)); arr[i] = String.fromCharCode(U.ri(33, 126)); line = arr.join(""); U.$(root, "#rs-byte").checked = false; }
    const sess = NEEDS_SESSION.has(m) ? (useS && session ? session : "DEADBEEF") : null;
    L(`<span class="dim">→ ${U.esc(line)} | CSeq: ${cseq}${sess ? " | Session: " + sess : ""}</span>`);
    cseq++;
    let code, text, next = state;
    const valid = line.startsWith(m + " ") && line.endsWith("RTSP/1.0");
    if (!valid) { code = 400; text = "Bad Request (the parser rejected the message before any state logic ran)"; }
    else if (!rfc && (m === "ANNOUNCE" || m === "RECORD")) { code = 405; text = "Method Not Allowed (Live555 does not support it, as in the case study)"; }
    else if (sess && sess !== session) { code = 454; text = "Session Not Found (wrong session ID: the LLM-without-context problem)"; }
    else {
      const n = rtspNext(state, m);
      if (!n) { code = 455; text = `Method Not Valid in This State (${m} in ${state})`; }
      else {
        code = 200; text = "OK"; next = n;
        if (m === "SETUP" && !session) session = (0x22B8 + U.ri(0, 4000)).toString(16).toUpperCase().padStart(8, "0");
        if (m === "PAUSE" && state === "PLAY") pausedFromPlay = true;
        if (m === "SETUP" && state === "INIT") pausedFromPlay = false;
        if (m === "TEARDOWN") { session = null; pausedFromPlay = false; }
        if (m === "PLAY" && state === "READY" && pausedFromPlay) {
          crashed = true;
          L(`<span class="bad">=================================================================
==1337==ERROR: AddressSanitizer: heap-use-after-free on address 0x6060000002c8
READ of size 8 at 0x6060000002c8 thread T0
    #0 in StreamState::startPlaying  (simulated trace)
freed by thread T0 here:
    #0 in operator delete
    #1 in RTSPServer::RTSPClientSession::handleCmd_PAUSE
SUMMARY: AddressSanitizer: heap-use-after-free</span>`);
          L(`<span class="good">You reproduced bug #1: SETUP → PLAY → PAUSE → PLAY. PAUSE freed the track's usage environment and PLAY used it again. PAUSE was missing from ProFuzzBench's seeds, and ChatAFL's seed enrichment is what added it.</span>`);
          trans.add(state + ">" + next); state = next; render(); api.done(); return;
        }
      }
    }
    codes.add(code);
    if (next !== state) trans.add(state + ">" + next);
    L(`<span class="${code === 200 ? "good" : code >= 450 ? "warn" : "bad"}">← RTSP/1.0 ${code} ${text}</span>`);
    state = next; render();
  };
  U.$$(root, "#rs-btns button").forEach(b => b.onclick = () => send(b.dataset.t));
  U.$(root, "#rs-reset").onclick = () => { state = "INIT"; session = null; cseq = 1; pausedFromPlay = false; crashed = false; L(`<span class="dim">--- server restarted ---</span>`); render(); };
  render();
};

    } else U.$(root, "#gp-out").innerHTML = "Not quite. Values are the parts a client could legitimately change: the URL, the sequence number, the user agent, the session ID and the range.";

      else { const s = toks.join(""); const arr = s.split(""); const n = U.ri(1, 4); for (let j = 0; j < n; j++) arr[U.ri(0, arr.length - 1)] = String.fromCharCode(U.ri(0, 255)); toks = [arr.join("")]; }

  render();

/* =====================================================================
   ChatAFL · Self-consistency (majority vote over 5 answers)
   ===================================================================== */
G.selfConsistency = function (root, api) {
  const FULL = {
    OPTIONS: ["CSeq", "User-Agent"], DESCRIBE: ["CSeq", "User-Agent", "Accept"], SETUP: ["CSeq", "User-Agent", "Transport"],
    PLAY: ["CSeq", "User-Agent", "Session", "Range"], PAUSE: ["CSeq", "User-Agent", "Session"], TEARDOWN: ["CSeq", "User-Agent", "Session"],
    GET_PARAMETER: ["CSeq", "User-Agent", "Session"], SET_PARAMETER: ["CSeq", "User-Agent", "Session"], ANNOUNCE: ["CSeq", "Session", "Content-Type"], RECORD: ["CSeq", "Session", "Range"]
  };
  const clone = () => JSON.parse(JSON.stringify(FULL));
  const ANSWERS = [
    () => clone(),
    () => { const a = clone(); a.PLAY = ["CSeq", "User-Agent", "Session"]; return a; },                       // forgot optional Range
    () => { const a = clone(); a["SET_DESCRIPTION"] = ["CSeq", "Session"]; return a; },                       // hallucinated type
    () => { const a = clone(); ["GET_PARAMETER", "SET_PARAMETER", "ANNOUNCE", "RECORD"].forEach(k => delete a[k]); return a; }, // ignored "all"
    () => { const a = clone(); a.PLAY = ["CSeq", "User-Agent", "Session"]; return a; }
  ];
  const got = [];
  root.innerHTML = `<div class="sim">
    <div class="codeblock small"><span class="c">// prompt (temperature 0.5)</span>
For the RTSP protocol, the PLAY client request grammar is: …   <span class="c">// shot 1</span>
For the HTTP protocol, the GET client request grammar is: …    <span class="c">// shot 2</span>
For the RTSP protocol, all of client request grammar is:</div>
    <div class="row"><button class="btn primary" id="sc-ask">Ask the LLM (1/5)</button><button class="btn" id="sc-vote" disabled>Majority vote</button></div>
    <div class="stack" id="sc-ans"></div>
    <div class="panel small" id="sc-out">Each answer is sampled independently, so look for the noise.</div>
  </div>`;
  const ask = () => {
    if (got.length >= 5) return;
    const a = ANSWERS[got.length](); got.push(a);
    const notes = ["Clean answer.", "PLAY is missing the optional Range field. The paper saw this in 15 of 50 answers.", "It invented a 'SET_DESCRIPTION' type. Rare in the paper: each random type appeared only once.", "It ignored the word 'all' and stopped after six types. ChatAFL just asks again for the rest.", "Range missing again."];
    U.$(root, "#sc-ans").insertAdjacentHTML("beforeend", `<div class="panel small"><b>Answer ${got.length}</b>: ${Object.keys(a).length} types · <span class="muted">${notes[got.length - 1]}</span><div class="mono" style="margin-top:4px;word-break:break-word">${Object.entries(a).map(([k, v]) => `${k}{${v.join(",")}}`).join(" ")}</div></div>`);
    U.$(root, "#sc-ask").textContent = got.length < 5 ? `Ask the LLM (${got.length + 1}/5)` : "5 answers collected";
    U.$(root, "#sc-ask").disabled = got.length >= 5;
    U.$(root, "#sc-vote").disabled = got.length < 5;
  };
  const vote = () => {
    const types = {}; got.forEach(a => Object.keys(a).forEach(t => types[t] = (types[t] || 0) + 1));
    const final = {}; const rows = [];
    Object.entries(types).forEach(([t, n]) => {
      const keep = n >= 3;
      if (keep) {
        const fc = {}; got.filter(a => a[t]).forEach(a => a[t].forEach(f => fc[f] = (fc[f] || 0) + 1));
        final[t] = Object.entries(fc).filter(([f, c]) => c * 2 > n || (c >= 2 && f === "Range")).map(([f]) => f);
      }
      rows.push(`<tr><td class="mono">${t}</td><td class="num">${n}/5</td><td>${keep ? `<span class="pill good">kept</span>` : `<span class="pill bad">dropped</span>`}</td><td class="mono small">${keep ? final[t].join(", ") : ""}</td></tr>`);
    });
    U.$(root, "#sc-out").innerHTML = `<div class="scrollx"><table class="data"><tr><th>Type</th><th class="num">votes</th><th></th><th>fields</th></tr>${rows.join("")}</table></div>
      <p style="margin-top:8px">The hallucinated type is dropped, all ten real types survive, and the stored grammar has the fields most answers agree on. ChatAFL used <b>5 repetitions</b> because the case study showed that was enough to filter incorrect cases.</p>
      <p class="muted">Field-level voting here is a simplification. The paper says it takes "the majority of consistent answers as the final grammar." PLAY's Range field appeared in 3 of 5 answers here (35 of 50 in the paper), so it is kept.</p>`;
    api.done();
  };
  U.$(root, "#sc-ask").onclick = ask; U.$(root, "#sc-vote").onclick = vote;
};

/* =====================================================================
   ChatAFL · Seed Enrichment

G.seedEnrich = function (root, api) {
  const seed = ["DESCRIBE", "SETUP", "PLAY", "TEARDOWN"];
  const sel = new Set(); let phase = 1; let seq = seed.slice(); let pending = ["PAUSE", "GET_PARAMETER"]; let armed = null;
  root.innerHTML = `<div class="sim">
    <div class="panel"><div class="eyebrow">Initial seed (ProFuzzBench, Live555)</div><div class="mono" style="margin-top:4px">${seed.join(" → ")}</div></div>
    <div id="se-body"></div>
  </div>`;
  const body = U.$(root, "#se-body");
  const phase1 = () => {
    body.innerHTML = `<div class="stack"><div><b>Step 1.</b> MissingTypes = AllTypes − ExistingTypes. Tap every type that is <b>missing</b> from the seed.</div>
      <div class="chips" id="se-types">${TYPES.map(t => `<button class="chip" data-t="${t}">${t}</button>`).join("")}</div>
      <div class="row"><button class="btn sm" id="se-c1">Check</button><span class="small muted" id="se-r1"></span></div></div>`;
    U.$$(body, "#se-types button").forEach(b => b.onclick = () => { sel.has(b.dataset.t) ? sel.delete(b.dataset.t) : sel.add(b.dataset.t); b.classList.toggle("on"); });
    U.$(body, "#se-c1").onclick = () => {
      const miss = TYPES.filter(t => !seed.includes(t)); const ok = miss.every(t => sel.has(t)) && [...sel].every(t => miss.includes(t));
      U.$(body, "#se-r1").textContent = ok ? "Correct: 6 of 10 types are missing." : "Not yet. The seed contains exactly DESCRIBE, SETUP, PLAY and TEARDOWN.";
      if (ok) { phase = 2; setTimeout(phase2, 700); }
    };
  };
  const simulate = (s) => { let st = "INIT"; const out = []; for (const m of s) { const n = rtspNext(st, m); out.push(n ? `200 (${st}→${n})` : `455 not valid in ${st}`); if (n) st = n; } return out; };
  const phase2 = () => {
    body.innerHTML = `<div class="stack"><div><b>Step 2.</b> ChatAFL adds <b>two missing types at a time</b>, to keep seeds short and diverse. The LLM proposes <b>PAUSE</b> and <b>GET_PARAMETER</b>. Pick a request, then tap the slot where it belongs.</div>
      <div class="row" id="se-pend"></div><div class="seqlist" id="se-seq"></div><div class="panel small" id="se-r2"></div></div>`;
    draw2();
  };
  const draw2 = () => {
    U.$(body, "#se-pend").innerHTML = pending.map(p => `<button class="btn sm ${armed === p ? "on" : ""}" data-p="${p}">${p}</button>`).join("") || `<span class="pill good">both inserted</span>`;
    U.$$(body, "#se-pend button").forEach(b => b.onclick = () => { armed = b.dataset.p; draw2(); });
    const res = simulate(seq);
    let h = `<button class="slot ${armed ? "armed" : ""}" data-k="0">insert here</button>`;
    seq.forEach((m, k) => { h += `<div class="seqitem ${seed.includes(m) ? "" : "new"}"><span>${k + 1}.</span><span>${m}</span><span class="small" style="margin-left:auto;color:${res[k].startsWith("200") ? "var(--cov)" : "var(--bad)"}">${res[k]}</span></div><button class="slot ${armed ? "armed" : ""}" data-k="${k + 1}">insert here</button>`; });
    U.$(body, "#se-seq").innerHTML = h;
    U.$$(body, "#se-seq .slot").forEach(s => s.onclick = () => { if (!armed) return; seq.splice(+s.dataset.k, 0, armed); pending = pending.filter(p => p !== armed); armed = null; draw2(); check(); });
  };
  const check = () => {
    const res = simulate(seq), r = U.$(body, "#se-r2");
    if (pending.length) { r.textContent = "One more to place."; return; }
    if (res.every(x => x.startsWith("200"))) {
      r.innerHTML = `<b>Every request accepted.</b> Your enriched seed now exercises PLAY→READY via PAUSE, a transition the original seeds never reached. This is the ingredient bug #1 needed. The LLM also copies context such as the session ID from the real seed it's given, which fixed the 24.5% session-mismatch failures from the case study.`;
      api.done();
    } else {
      r.innerHTML = `Some requests get <b>455</b>, meaning not valid in that state. Remember PAUSE is only valid in PLAY (or RECORD), and GET_PARAMETER needs a session (READY or later). <button class="btn sm" id="se-retry">Try again</button>`;
      U.$(body, "#se-retry").onclick = () => { seq = seed.slice(); pending = ["PAUSE", "GET_PARAMETER"]; draw2(); r.textContent = ""; };
    }
  };
  phase1();
};

/* =====================================================================
   ChatAFL · Plateau Breaker
   ===================================================================== */
G.plateauBreaker = function (root, api) {
  let maxP = 512, running = false;
  root.innerHTML = `<div class="sim">
    <label class="small" for="pb-max">MaxPlateau = <b id="pb-mv">512</b> uninteresting sequences</label>
    <input type="range" id="pb-max" min="0" max="7" step="1" value="4">
    <canvas id="pb-cv"></canvas>
    <div class="legend"><span><i style="background:var(--muted)"></i>AFLNet (no LLM)</span><span><i style="background:var(--chat)"></i>ChatAFL</span><span><i style="background:var(--warn)"></i>LLM call</span></div>
    <div class="kv panel" id="pb-kv"><span>PlateauLen</span><b>0</b></div>
    <button class="btn primary" id="pb-run">Run 24 simulated hours</button>
    <div class="panel small" id="pb-msg">Same random world for both fuzzers. Only the plateau handler differs.</div>
  </div>`;
  const VALS = [32, 64, 128, 256, 512, 1024, 2048, 8192];
  U.$(root, "#pb-max").oninput = (e) => { maxP = VALS[+e.target.value]; U.$(root, "#pb-mv").textContent = maxP; };
  const sim = (useLLM, seed) => {
    const r = U.rng(seed); const REG = [180, 120, 140, 90, 110, 80, 100, 70]; let unlocked = 1, found = 0, plateau = 0, calls = 0, ineff = 0, maxIneff = Math.floor(maxP / 4);
    const series = [], callsAt = []; const EX = 120000;
    for (let e = 1; e <= EX; e++) {
      const reach = REG.slice(0, unlocked).reduce((a, b) => a + b, 0), unf = reach - found;
      let interesting = false;
      if (r() < 0.03 * Math.pow(unf / reach, 2.2)) { found++; interesting = true; }
      if (unlocked < REG.length && r() < 0.000012) { unlocked++; interesting = true; }
      if (interesting) plateau = 0; else plateau++;
      if (useLLM && plateau > maxP && ineff < maxIneff) {
        calls++; callsAt.push(e);
        if (unlocked < REG.length && r() < 0.75) { unlocked++; plateau = 0; } else { ineff++; plateau = 0; }
      }
      if (e % 1000 === 0) series.push(found);
    }
    return { series, calls, ineff, found, unlocked, callsAt, plateau, maxIneff };
  };
  const draw = (A, C) => {

  const list = () => {
    const items = FL.GLOSSARY.filter(g => (filter === "all" || g.paper === filter) && (!q || (g.term + " " + g.def).toLowerCase().includes(q)));
    U.$(main(), "#gl").innerHTML = items.map(g => { const [t, c] = PAPER_TAG[g.paper]; return `<div class="gl-item"><h4>${U.esc(g.term)} <span class="tag" style="--tc:${c}">${t}</span></h4><p class="small" style="margin-top:4px">${U.esc(g.def)}</p>${g.ex ? `<p class="small muted" style="margin-top:4px"><b>e.g.</b> ${U.esc(g.ex)}</p>` : ""}</div>`; }).join("") || `<p class="muted">No term matches "${U.esc(q)}". Try a shorter word.</p>`;
  };
  U.$(main(), "#gq").oninput = (e) => { q = e.target.value.trim().toLowerCase(); list(); };
  U.$$(main(), "#gf button").forEach(b => b.onclick = () => { filter = b.dataset.k; U.$$(main(), "#gf button").forEach(x => x.classList.toggle("on", x === b)); list(); });
  list();
}

/* ---------------- viva (oral exam drill with spaced repetition) ---------------- */
function renderViva() {
  let filter = "all", cur = null, revealed = false;
  const pool = () => FL.VIVA.map((v, i) => ({ ...v, i })).filter(v => filter === "all" || v.p === filter);
  const pickNext = () => {
    const now = Date.now(); const P = pool();
    const due = P.filter(v => !S.viva[v.i] || S.viva[v.i].due <= now);
    const from = due.length ? due : P;
    // prefer unseen, then lowest box
    from.sort((a, b) => ((S.viva[a.i] ? S.viva[a.i].box : -1) - (S.viva[b.i] ? S.viva[b.i].box : -1)) || (Math.random() - .5));
    return from[0];
  };
  main().innerHTML = `<h2 style="font-size:26px">Viva Drill</h2>
    <p class="muted">The doctor asks. Answer out loud first, then reveal the model answer and grade yourself honestly. Missed questions come back sooner.</p>
    <div class="chips" id="vf">${[["all", "All"], ["core", "Core"], ["fox", "FOX"], ["chat", "ChatAFL"], ["f4a", "Fuzz4All"], ["x", "Compare"]].map(([k, n]) => `<button class="chip ${k === "all" ? "on" : ""}" data-k="${k}">${n}</button>`).join("")}</div>
    <div class="card viva-card" id="vc"></div>
    <div class="small muted" id="vstat"></div>`;
  const stat = () => {
    const P = pool(); const m = P.filter(v => S.viva[v.i] && S.viva[v.i].box >= 2).length;
    U.$(main(), "#vstat").textContent = `Mastered ${m}/${P.length} in this set · answered ${Object.keys(S.viva).length}/${FL.VIVA.length} overall`;
  };
  const draw = () => {
    cur = pickNext(); revealed = false; if (!cur) return;
    const [tag, col] = PAPER_TAG[cur.p];
    const lvl = ["", "Recall", "Explain", "Critique"][cur.l];
    U.$(main(), "#vc").innerHTML = `<div class="doctor"><div class="av" style="--avc:var(--final)">Dr</div><div><b>The Doctor asks</b><div class="row" style="gap:6px;margin-top:2px"><span class="tag" style="--tc:${col}">${tag}</span><span class="pill">${lvl}</span></div></div></div>
      <div class="viva-q">${U.esc(cur.q)}</div>
      <button class="btn primary" id="rev">Reveal model answer</button>
      <div class="answer" id="ans" hidden>
        <p>${U.esc(cur.a)}</p>
        <div><div class="eyebrow" style="margin-bottom:4px">Key points to hit</div><div class="chips">${cur.k.map(k => `<span class="pill">${U.esc(k)}</span>`).join("")}</div></div>
        <div class="eyebrow">How did you do?</div>
        <div class="grid2" style="grid-template-columns:repeat(3,1fr)"><button class="btn" data-g="0">Missed</button><button class="btn" data-g="1">Partly</button><button class="btn primary" data-g="2">Nailed it</button></div>
      </div>`;
    U.$(main(), "#rev").onclick = () => { U.$(main(), "#ans").hidden = false; U.$(main(), "#rev").hidden = true; };
    U.$$(main(), "#ans [data-g]").forEach(b => b.onclick = () => {
      const g = +b.dataset.g; const prev = S.viva[cur.i] || { box: 0, due: 0 };
      const box = g === 2 ? Math.min(prev.box + 1, 4) : g === 1 ? Math.max(prev.box, 1) : 0;
      const wait = [1, 5, 30, 240, 1440][box] * 60000 * (g === 0 ? 0.2 : 1);
      const first = !S.viva[cur.i];
      S.viva[cur.i] = { box, due: Date.now() + wait }; save();
      if (first) addXP(g === 2 ? 12 : g === 1 ? 8 : 4, "viva");
      if (Object.keys(S.viva).length >= 20) award("viva20", "Viva Veteran");
      if (Object.values(S.viva).filter(v => v.box >= 2).length >= 30) award("viva-master", "Defense Ready");
      stat(); draw();
    });
  };
  U.$$(main(), "#vf button").forEach(b => b.onclick = () => { filter = b.dataset.k; U.$$(main(), "#vf button").forEach(x => x.classList.toggle("on", x === b)); stat(); draw(); });
  stat(); draw();
}

/* ---------------- profile ---------------- */
function renderProfile() {
  const B = [["ch-boot", "Bootcamp", "Finish the prologue"], ["ch-fox", "FOX: The Control Room", "Finish chapter 1"], ["ch-chat", "ChatAFL: The Protocol Whisperer", "Finish chapter 2"], ["ch-f4a", "Fuzz4All: One Fuzzer, Every Language", "Finish chapter 3"], ["ch-final", "Defense Day", "Finish the finale"],
    ["newton", "Newton's Apprentice", "Flip a branch with Newton's method"], ["uaf", "Use-After-Free Hunter", "Reproduce ChatAFL bug #1"], ["lexicon", "Lexicon", "Open 25 glossary terms"], ["viva20", "Viva Veteran", "Answer 20 viva questions"], ["viva-master", "Defense Ready", "Master 30 viva questions"]];
  const r = rankOf(S.xp);
  main().innerHTML = `<h2 style="font-size:26px">Your lab notebook</h2>
    <div class="card"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Rank</div><div class="big-num">${r.name}</div></div><div style="text-align:right"><div class="eyebrow">Experience</div><div class="big-num">${S.xp}</div></div></div>
    <div class="meterbar" style="margin-top:10px"><i style="width:${r.next ? (S.xp - r.base) / (r.next[0] - r.base) * 100 : 100}%"></i></div>
    <p class="small muted" style="margin-top:6px">${r.next ? `${r.next[0] - S.xp} XP to ${r.next[1]}` : "Top rank reached."} Ranks: ${RANKS.map(x => x[1]).join(" → ")}</p></div>
    <div class="eyebrow">Badges</div>
    <div class="badge-grid">${B.map(([id, n, d]) => `<div class="badge ${S.badges[id] ? "got" : ""}"><div class="ic">${S.badges[id] ? "★" : "?"}</div><b>${n}</b><span>${d}</span></div>`).join("")}</div>
    <div class="eyebrow">Checkpoint scores</div>
    <div class="card flat"><table class="data">${FL.CHAPTERS.flatMap(c => c.steps.filter(s => s.type === "quiz").map(s => `<tr><td>${U.esc(s.title)}</td><td class="num">${S.quiz[s.id] !== undefined ? S.quiz[s.id] + "/" + s.qs.length : "not taken"}</td></tr>`)).join("")}</table></div>
    <div class="eyebrow">Papers</div>
    <div class="stack small">${FL.CHAPTERS.filter(c => c.paper).map(c => `<div class="card flat" style="border-left:5px solid ${c.color}">${U.esc(c.paper)}</div>`).join("")}</div>
    <div class="row"><button class="btn sm" id="theme">Theme: <span id="thv"></span></button><button class="btn sm ghost" id="reset">Reset progress</button></div>
    <div id="confirm"></div>`;
  const th = () => U.$(main(), "#thv").textContent = document.documentElement.dataset.theme || "system";
  th();
  U.$(main(), "#theme").onclick = () => { const cur = document.documentElement.dataset.theme; const nx = !cur ? "dark" : cur === "dark" ? "light" : ""; if (nx) document.documentElement.dataset.theme = nx; else delete document.documentElement.dataset.theme; try { localStorage.setItem(KEY + ".theme", nx); } catch (e) {} th(); };
  U.$(main(), "#reset").onclick = () => {
    U.$(main(), "#confirm").innerHTML = `<div class="callout trap"><p>This erases XP, badges, quiz scores and viva history on this device.</p><div class="row" style="margin-top:8px"><button class="btn sm" id="rk">Keep my progress</button><button class="btn sm primary" id="ry">Erase progress</button></div></div>`;
    U.$(main(), "#rk").onclick = () => U.$(main(), "#confirm").innerHTML = "";
    U.$(main(), "#ry").onclick = () => { S = blank(); save(); drawTop(); toast("Progress erased"); renderProfile(); };
  };
}

/* ---------------- boot ---------------- */
try { const t = localStorage.getItem(KEY + ".theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
U.$$(document, ".nav button").forEach(b => b.onclick = () => go({ name: b.dataset.v }));
U.$(document, "#homebtn").onclick = () => go({ name: "home" });
drawTop();
const start = () => fromHash();
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
})();
</script>
