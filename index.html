<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<title>Fuzz Lab Chronicles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A story-driven mobile game for learning three fuzzing papers: FOX (CCS'24), ChatAFL (NDSS'24) and Fuzz4All (ICSE'24).">
<meta name="theme-color" content="#16202B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>/* Layout concept: a phone-first lab notebook. One column, graph-paper ground,
   a sticky instrument bar on top and a thumb-reach nav on the bottom.
   Each paper has its own ink colour so you always know which world you are in. */
:root {
  --bg: #EDF0F3;
  --paper: #FFFFFF;
  --paper-2: #F6F8FA;
  --ink: #16202B;
  --muted: #5A6675;
  --line: #D5DBE2;
  --grid: rgba(22, 32, 43, 0.055);
  --accent: #D9481F;      /* crash orange: primary action */
  --accent-ink: #FFFFFF;
  --cov: #13866F;         /* covered / success */
  --warn: #B7791F;
  --bad: #C0392B;
  --boot: #2F63C8;        /* prologue ink */
  --fox: #D9481F;         /* FOX ink */
  --chat: #0F8571;        /* ChatAFL ink */
  --f4a: #6F45C9;         /* Fuzz4All ink */
  --final: #A2550F;
  --shadow: 0 1px 2px rgba(16, 24, 32, .06), 0 6px 18px rgba(16, 24, 32, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 14px;
  --r-sm: 9px;
  --nav-h: 64px;
  --hero-bg: #16202B;
  --hero-fg: #F3F5F8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131A; --paper: #171E27; --paper-2: #1D2530; --ink: #E6EBF1; --muted: #93A0B0;
    --line: #2B3542; --grid: rgba(230, 235, 241, 0.04); --accent: #FF7447; --accent-ink: #1A0E08;
    --cov: #39C9A8; --warn: #E8B04B; --bad: #FF6B5B; --boot: #79A6FF; --fox: #FF7447; --chat: #39C9A8;
    --f4a: #AD8CFF; --final: #F0A35A; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131A; --paper: #171E27; --paper-2: #1D2530; --ink: #E6EBF1; --muted: #93A0B0;
  --line: #2B3542; --grid: rgba(230, 235, 241, 0.04); --accent: #FF7447; --accent-ink: #1A0E08;
  --cov: #39C9A8; --warn: #E8B04B; --bad: #FF6B5B; --boot: #79A6FF; --fox: #FF7447; --chat: #39C9A8;
  --f4a: #AD8CFF; --final: #F0A35A; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font: 15.5px/1.55 var(--f-body);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--paper);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
code, .mono { font-family: var(--f-mono); font-size: .88em; }
a { color: var(--accent); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: .02em; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); display: grid; place-items: center; }
.brand-mark svg { display: block; }
.xpbox { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
.rank { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
.xpbar { width: 86px; height: 8px; border-radius: 99px; background: var(--paper-2); border: 1px solid var(--line); overflow: hidden; }
.xpbar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .5s; }
.xpnum { font: 600 12px var(--f-mono); color: var(--ink); white-space: nowrap; }
.iconbtn { border: 1px solid var(--line); background: var(--paper-2); border-radius: 10px; width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; flex: none; }

/* ---------- main column ---------- */
main {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
}
.col { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* ---------- bottom nav ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--paper); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); cursor: pointer; letter-spacing: .02em; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--accent); }

/* ---------- generic pieces ---------- */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.eyebrow { font: 600 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.stack > *, .col > *, .sim > *, .lesson > * { min-width: 0; max-width: 100%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .grid2.collapse { grid-template-columns: 1fr; } }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--paper-2); color: var(--ink);
  border-radius: 11px; padding: 10px 14px; font-weight: 600; font-size: 14.5px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px;
  transition: transform .08s, background .15s, border-color .15s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 6px 11px; font-size: 13.5px; border-radius: 9px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.on { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 3px 10px; font: 600 12px var(--f-mono); border: 1px solid var(--line); background: var(--paper-2); white-space: nowrap; }
.pill.good { color: var(--cov); border-color: color-mix(in srgb, var(--cov) 45%, var(--line)); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.hr { height: 1px; background: var(--line); border: 0; margin: 4px 0; }
.scrollx { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
.codeblock { max-width: 100%; font: 13px/1.5 var(--f-mono); background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; white-space: pre; overflow-x: auto; }
.codeblock .k { color: var(--f4a); font-weight: 600; }
.codeblock .c { color: var(--muted); }
.codeblock .s { color: var(--cov); }
.codeblock .hl { background: color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 3px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%) translateY(20px); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
  z-index: 60; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- home / map ---------- */
.hero { padding: 20px 18px; border-radius: var(--r); background: var(--hero-bg); color: var(--hero-fg); border: 1px solid var(--line); position: relative; overflow: hidden; }
.hero h1 { font-size: clamp(28px, 7.5vw, 40px); font-weight: 800; }
.hero p { color: color-mix(in srgb, var(--hero-fg) 78%, transparent); margin-top: 8px; max-width: 52ch; }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .35; pointer-events: none; }
.hero > *:not(canvas) { position: relative; }
.hero .row { margin-top: 14px; }
.chap {
  display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; text-align: left; width: 100%;
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; cursor: pointer; box-shadow: var(--shadow);
  border-left: 5px solid var(--c, var(--accent));
}
.chap .num { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; font: 800 20px var(--f-display); color: var(--paper); background: var(--c, var(--accent)); }
.chap h3 { font-size: 18px; }
.chap .venue { font: 600 11.5px var(--f-mono); color: var(--c); letter-spacing: .06em; text-transform: uppercase; }
.chap .meter { height: 6px; border-radius: 99px; background: var(--paper-2); border: 1px solid var(--line); overflow: hidden; margin-top: 8px; }
.chap .meter i { display: block; height: 100%; background: var(--c); }
.chap.locked { opacity: .55; }
.statrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px; }
.stat b { display: block; font: 800 22px var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }

/* ---------- chapter player ---------- */
.chhead { display: flex; flex-direction: column; gap: 8px; }
.chhead .back { align-self: flex-start; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dots button { width: 18px; height: 8px; border-radius: 99px; border: 0; background: var(--line); cursor: pointer; padding: 0; }
.dots button.done { background: color-mix(in srgb, var(--c) 55%, var(--line)); }
.dots button.cur { background: var(--c); width: 28px; }
.steptitle { font-size: 24px; font-weight: 800; }
.steptype { font: 600 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--c); }
.pager { position: sticky; bottom: calc(var(--nav-h) + 10px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: auto 1fr; gap: 10px; z-index: 5; }
.pager .btn { box-shadow: var(--shadow); }
.lesson { display: flex; flex-direction: column; gap: 12px; }
.lesson p, .lesson li { max-width: 68ch; }
.lesson ul, .lesson ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.lesson h4 { font-size: 16.5px; margin-top: 6px; }
.callout { border: 1px solid var(--line); border-left: 4px solid var(--c, var(--accent)); background: var(--paper-2); border-radius: var(--r-sm); padding: 10px 12px; }
.callout.say { border-left-color: var(--cov); }
.callout.say::before { content: "SAY IT TO THE DOCTOR"; display: block; font: 700 10.5px var(--f-mono); letter-spacing: .14em; color: var(--cov); margin-bottom: 4px; }
.callout.trap { border-left-color: var(--bad); }
.callout.trap::before { content: "COMMON TRAP"; display: block; font: 700 10.5px var(--f-mono); letter-spacing: .14em; color: var(--bad); margin-bottom: 4px; }
.callout.story { border-left-color: var(--warn); }
.callout.story::before { content: "BEHIND THE SCENES"; display: block; font: 700 10.5px var(--f-mono); letter-spacing: .14em; color: var(--warn); margin-bottom: 4px; }
.eq { font: 15px/1.6 var(--f-mono); background: var(--paper-2); border: 1px dashed var(--line); padding: 10px 12px; border-radius: var(--r-sm); overflow-x: auto; white-space: nowrap; }
.t { border-bottom: 2px dotted var(--c, var(--accent)); cursor: help; font-weight: 600; }
table.data { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.data th { font: 600 11.5px var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
table.data td.num, table.data th.num { text-align: right; }
table.data tr.best td { font-weight: 700; }

/* scene / dialogue */
.scene { display: flex; flex-direction: column; gap: 10px; }
.setting { font: 600 12px var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.disclaim { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 9px; padding: 6px 10px; }
.line { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; animation: rise .35s both; }
.line.me { grid-template-columns: 1fr 40px; }
.line.me .av { order: 2; }
.line.narr { grid-template-columns: 1fr; }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--f-display); color: #fff; background: var(--avc, var(--muted)); }
.bubble { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; box-shadow: var(--shadow); min-width: 0; }
.line.me .bubble { background: color-mix(in srgb, var(--c) 10%, var(--paper)); }
.bubble .who { font: 700 12px var(--f-body); color: var(--avc, var(--muted)); margin-bottom: 2px; }
.bubble .who small { font-weight: 500; color: var(--muted); }
.line.narr .bubble { background: transparent; border-style: dashed; box-shadow: none; font-style: italic; color: var(--muted); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .line, .toast, .xpbar > i { animation: none !important; transition: none !important; } }
.tapnext { align-self: center; }

/* quiz */
.q { display: flex; flex-direction: column; gap: 10px; }
.q .prompt { font-weight: 600; font-size: 16px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 11px 13px; cursor: pointer; min-height: 46px; line-height: 1.4; }
.opt.right { border-color: var(--cov); background: color-mix(in srgb, var(--cov) 12%, var(--paper)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--paper)); }
.opt:disabled { cursor: default; }
.explain { background: var(--paper-2); border-radius: 10px; padding: 10px 12px; font-size: 14px; border: 1px solid var(--line); }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* sheet (glossary popover) */
.sheet-back { position: fixed; inset: 0; background: rgba(8, 12, 18, .45); z-index: 70; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--paper); width: 100%; max-width: 720px; border-radius: 18px 18px 0 0; padding: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 80vh; overflow-y: auto; box-shadow: var(--shadow); animation: rise .25s both; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.sheet h3 { font-size: 21px; }
.tag { font: 600 11px var(--f-mono); padding: 2px 8px; border-radius: 99px; color: var(--paper); background: var(--tc, var(--muted)); }

/* glossary */
.search { width: 100%; border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 12px 14px; font: inherit; color: var(--ink); min-height: 46px; }
.gl-item { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.gl-item h4 { font-size: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 34px; }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* viva */
.viva-card { min-height: 220px; display: flex; flex-direction: column; gap: 12px; }
.viva-q { font: 700 19px/1.3 var(--f-display); }
.doctor { display: flex; gap: 10px; align-items: center; }
.doctor .av { --avc: var(--final); }
.answer { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.answer ul { margin: 0; padding-left: 20px; }

/* sims */
.sim { display: flex; flex-direction: column; gap: 12px; }
.sim canvas, .sim svg { display: block; width: 100%; max-width: 100%; touch-action: manipulation; }
.panel { background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; min-width: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13.5px; }
.kv b { font-family: var(--f-mono); font-weight: 600; }
.bytes { display: flex; gap: 4px; flex-wrap: wrap; font: 600 15px var(--f-mono); }
.bytes span { min-width: 30px; text-align: center; padding: 6px 4px; border-radius: 7px; border: 1px solid var(--line); background: var(--paper); }
.bytes span.chg { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--paper)); }
.bytes span.ok { border-color: var(--cov); background: color-mix(in srgb, var(--cov) 14%, var(--paper)); }
.bytes span.hot { outline: 2px solid var(--warn); }
.log { font: 12.5px/1.5 var(--f-mono); background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; max-height: 190px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
.log .good { color: var(--cov); } .log .bad { color: var(--bad); } .log .warn { color: var(--warn); } .log .dim { color: var(--muted); }
.meterbar { height: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.meterbar > i { display: block; height: 100%; background: var(--c, var(--accent)); transition: width .3s; }
input[type="range"] { width: 100%; accent-color: var(--c, var(--accent)); min-height: 32px; }
.msgbtns { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.msgbtns .btn { font: 600 12.5px var(--f-mono); min-height: 40px; padding: 6px; }
.tok { display: inline-block; padding: 2px 3px; margin: 1px 0; border-radius: 5px; cursor: pointer; border: 1px dashed transparent; }
.tok:hover { border-color: var(--line); }
.tok.mut { background: color-mix(in srgb, var(--chat) 22%, transparent); border-color: var(--chat); }
.tok.wrongmark { background: color-mix(in srgb, var(--bad) 22%, transparent); }
.msgline { font: 13.5px/1.9 var(--f-mono); word-break: break-all; }
.seqlist { display: flex; flex-direction: column; gap: 6px; }
.seqitem { display: flex; align-items: center; gap: 8px; font: 600 13px var(--f-mono); padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--paper); }
.seqitem.new { border-color: var(--chat); background: color-mix(in srgb, var(--chat) 12%, var(--paper)); }
.slot { border: 1.5px dashed var(--line); border-radius: 9px; padding: 4px; text-align: center; font-size: 12px; color: var(--muted); cursor: pointer; min-height: 30px; background: transparent; width: 100%; }
.slot.armed { border-color: var(--chat); color: var(--chat); }

<script>/* Glossary. paper: core | fox | chat | f4a.  Every definition is phrased the way
   you would say it out loud in an oral exam. */
window.FL = window.FL || {};
FL.GLOSSARY = [
  // ---------------- core fuzzing vocabulary ----------------
  { id: "fuzzing", term: "Fuzzing (fuzz testing)", paper: "core",
    def: "Automated testing that generates many (often random or semi-random) inputs, runs them against the target program, and watches for unexpected behaviour such as crashes. FOX's definition: 'generating random test inputs and executing them against the target program'.",
    ex: "Feeding 10 million slightly broken PDF files to a PDF reader to see if any crash it." },
  { id: "sut", term: "SUT (System Under Test)", paper: "core",
    def: "The program being fuzzed. Fuzz4All uses this term a lot: compilers (GCC, Clang), SMT solvers (Z3, CVC5), the Go toolchain, javac and Qiskit are its SUTs.", ex: "In ChatAFL the SUTs are network servers like Live555 or ProFTPD." },
  { id: "seed", term: "Seed / seed input", paper: "core",
    def: "A starting input given to a mutation-based fuzzer. The fuzzer creates new inputs by modifying seeds. Good seeds are valid and diverse.", ex: "A well-formed PNG file used to fuzz libpng." },
  { id: "corpus", term: "Seed corpus (queue)", paper: "core",
    def: "The set of inputs the fuzzer keeps. In coverage-guided fuzzing, any mutant that reaches new coverage is added to the corpus. FOX writes the corpus at stage i as S_i.", ex: "AFL++'s 'queue' directory." },
  { id: "mutation", term: "Mutation", paper: "core",
    def: "A small change applied to an input: flipping bits, replacing bytes, inserting or deleting chunks, splicing two inputs, and so on.", ex: "'GET' → 'GQT' is a byte-replacement mutation." },
  { id: "havoc", term: "Havoc mode", paper: "core",
    def: "AFL/AFL++'s random mutation stage: it stacks several random mutations (bit flips, arithmetic, block deletes/inserts, interesting values) on one seed. FOX reuses AFL++ havoc for its local search, but reduces the number of stacked perturbations so the mutants stay in a small neighbourhood N(x).", ex: "" },
  { id: "mutation-based", term: "Mutation-based fuzzer", paper: "core",
    def: "Creates new inputs by mutating existing seeds. Pros: needs no specification. Cons: limited by seed quality and by the mutation operators. AFL++, AFLNet, NSFuzz and GrayC are mutation-based.", ex: "" },
  { id: "generation-based", term: "Generation-based fuzzer", paper: "core",
    def: "Synthesises inputs from scratch, usually from a grammar or a hand-written model of the input format. Pros: inputs are valid. Cons: building the generator is laborious and it often covers only part of the language. Csmith, YARPGen, Peach and BooFuzz are generation-based.", ex: "Csmith has more than 80k lines of code to generate valid C programs." },
  { id: "greybox", term: "Greybox fuzzing", paper: "core",
    def: "Fuzzing that uses lightweight feedback from the target (usually code coverage from compile-time instrumentation) but no heavy analysis. AFL, AFL++, AFLNet, FOX and ChatAFL are greybox fuzzers.", ex: "" },
  { id: "blackbox", term: "Blackbox fuzzing", paper: "core",
    def: "Fuzzing with no visibility into the program's internals, only its outputs. Fuzz4All needs no instrumentation of the SUT, which makes it easy to apply. Its loop is guided by the LLM, not by coverage feedback.", ex: "" },
  { id: "whitebox", term: "Whitebox fuzzing", paper: "core",
    def: "Fuzzing that uses heavy program analysis such as symbolic execution or taint tracking (e.g., SAGE, KLEE, Polyglot). Precise but slow and hard to scale.", ex: "" },
  { id: "coverage-guided", term: "Coverage-guided fuzzing", paper: "core",
    def: "A greybox loop: pick a seed, mutate it, run it, and keep the mutant if it reaches code nobody reached before. FOX calls it 'the prevailing approach to fuzzing, aiming to maximize edge coverage within a given time budget'.", ex: "" },
  { id: "instrumentation", term: "Instrumentation", paper: "core",
    def: "Extra code inserted into the target (usually by a compiler pass such as an LLVM pass) so it reports what it did, e.g., which edges were executed. FOX adds an LLVM pass that also records the operands of comparisons.", ex: "" },
  { id: "basic-block", term: "Basic block", paper: "core",
    def: "A straight-line sequence of instructions with one entry and one exit and no branches in between. Nodes of the control-flow graph.", ex: "" },
  { id: "cfg", term: "Control-flow graph (CFG)", paper: "core",
    def: "A graph G = (N, E) whose nodes N are basic blocks and whose edges E are possible jumps between them. FOX extracts an intra-procedural CFG (one per function) at compile time and embeds it in the binary.", ex: "" },
  { id: "edge-coverage", term: "Edge coverage", paper: "core",
    def: "Which CFG edges (transitions between basic blocks) at least one input has executed. AFL-family fuzzers track edges in a shared-memory bitmap. FOX reports results as 'edges found'.", ex: "" },
  { id: "branch-coverage", term: "Branch coverage", paper: "core",
    def: "Which outcomes of conditional branches were executed. ChatAFL reports branch coverage measured by ProFuzzBench tooling.", ex: "" },
  { id: "line-coverage", term: "Line coverage", paper: "core",
    def: "Which source lines executed. Fuzz4All reports line coverage for all its SUTs so the numbers are uniform across languages.", ex: "" },
  { id: "bitmap", term: "Coverage bitmap", paper: "core",
    def: "A compact shared-memory array where the instrumented target marks the edges it executes. The fuzzer reads it after each run to decide if the input is 'interesting'.", ex: "" },
  { id: "plateau", term: "Coverage plateau (saturation)", paper: "core",
    def: "The phase where the fuzzer keeps running but stops finding new coverage. ChatAFL measures it as PlateauLen, the number of consecutive uninteresting inputs. Fuzz4All observes that baselines plateau while it keeps climbing.", ex: "" },
  { id: "oracle", term: "Test oracle", paper: "core",
    def: "The rule that decides whether an execution is a bug. The simplest oracle is a crash. Others: sanitizer reports, internal assertion failures, differential testing (compare two compilers or two optimisation levels).", ex: "Fuzz4All's Qiskit oracle exports a circuit to QASM and re-imports it." },
  { id: "asan", term: "AddressSanitizer (ASAN)", paper: "core",
    def: "A compiler-inserted runtime checker that detects memory errors (use-after-free, buffer overflows, leaks) and prints a stack trace. ChatAFL runs targets under ASAN and separates distinct bugs by their ASAN stack traces.", ex: "" },
  { id: "sanitizer", term: "Sanitizer", paper: "core",
    def: "A family of runtime checkers (ASAN, UBSAN, MSAN…) that turn silent memory or undefined-behaviour bugs into visible crashes, so the oracle can catch them.", ex: "" },
  { id: "crash-dedup", term: "Crash deduplication", paper: "core",
    def: "Grouping many crashing inputs into unique bugs. FOX hashes the stack trace of each crash and then checks manually. ChatAFL compares ASAN stack traces.", ex: "" },
  { id: "afl", term: "AFL / AFL++", paper: "core",
    def: "American Fuzzy Lop, the classic coverage-guided greybox fuzzer, and AFL++, its community successor. AFL++ (v4.09c) topped the Dec 2023 FuzzBench report and is FOX's main baseline.", ex: "" },
  { id: "cmplog", term: "cmplog (AFL++ +C)", paper: "core",
    def: "An AFL++ mode that intercepts the operands of comparison (CMP) instructions and copies the expected value into the input. It is the industry implementation of REDQUEEN's input-to-state correspondence. FOX calls it AFLPP+C and treats it as the closest competitor to its own mutator.", ex: "if (x == 0xdeadbeef): cmplog sees 0xdeadbeef and plants it in the input." },
  { id: "dictionary", term: "Fuzzing dictionary (+D)", paper: "core",
    def: "A list of tokens (string and integer constants pulled from the program, or supplied by the benchmark) that the mutator can insert. AFLPP+CD is AFL++ with cmplog and a dictionary, the strongest industrial setting. FOX+D is FOX with a dictionary.", ex: "" },
  { id: "redqueen", term: "REDQUEEN", paper: "core",
    def: "NDSS'19 fuzzer that uses 'input-to-state correspondence': it finds input bytes that appear directly in comparison operands and replaces them with the compared value. It uses colorization of inputs and assumes input consistency.", ex: "" },
  { id: "taint", term: "Taint tracking / taint inference", paper: "core",
    def: "Tracking which input bytes influence which program values. Precise, but FOX notes it 'tends to incur prohibitively high overhead', which is why FOX uses cheap local search and finds 'hot bytes' instead.", ex: "" },
  { id: "energy", term: "Energy / power schedule", paper: "core",
    def: "How many mutations a fuzzer spends on a chosen seed before moving on. ChatAFL's Algorithm 1 calls AssignEnergy(M).", ex: "" },
  { id: "scheduler", term: "Seed scheduler", paper: "core",
    def: "The component that decides which seed to mutate next. FOX argues that existing schedulers suffer from information sparsity and often degenerate into round-robin.", ex: "" },
  { id: "round-robin", term: "Round-robin scheduling", paper: "core",
    def: "Cycling through all seeds in turn with no preference. FOX says coverage-increasing inputs become rare over time, so classic schedulers lose their signal and drift into round-robin.", ex: "" },
  { id: "fuzzbench", term: "FuzzBench", paper: "core",
    def: "Google's open benchmarking service for fuzzers. FOX uses all 23 binaries but notes many are small (about a third have under 20,000 edges) or ship many test cases, so they saturate early.", ex: "" },
  { id: "magma", term: "Magma", paper: "core",
    def: "A ground-truth bug benchmark: real libraries with injected, known bugs, so you can count bugs 'reached' and 'triggered'. FOX uses 17 programs from 8 libraries (php skipped because of a linking error).", ex: "" },
  { id: "profuzzbench", term: "ProFuzzBench", paper: "core",
    def: "A benchmark of network protocol servers for stateful fuzzers. ChatAFL uses all its text-based protocol subjects: Live555 (RTSP), ProFTPD and PureFTPD (FTP), Kamailio (SIP), Exim (SMTP), forked-daapd (DAAP).", ex: "" },
  { id: "mwu", term: "Mann-Whitney U test", paper: "core",
    def: "A non-parametric statistical test of whether one set of results tends to be larger than another. It makes no assumption about the distribution, so it fits randomized algorithms like fuzzers. FOX and Fuzz4All use p < 0.05 as significant.", ex: "" },
  { id: "a12", term: "Vargha-Delaney Â12", paper: "core",
    def: "An effect size: the probability that a random run of tool A beats a random run of tool B. 0.5 means no difference, 1.0 means A always wins. ChatAFL reports Â12 ≥ 0.86 for state transitions.", ex: "" },
  { id: "klees", term: "Klees et al. guidelines", paper: "core",
    def: "'Evaluating Fuzz Testing' (CCS'18): run many trials (e.g., 10 × 24h), use statistical tests, use ground-truth bug benchmarks, dedup crashes carefully. All three papers follow these practices.", ex: "" },
  { id: "ablation", term: "Ablation study", paper: "core",
    def: "Turning components of a system off one at a time to measure how much each one contributes. FOX: BASE vs SCHED vs FULL. ChatAFL: CL0 to CL3. Fuzz4All: prompt variants and fuzzing-loop variants.", ex: "" },
  { id: "cve", term: "CVE", paper: "core",
    def: "Common Vulnerabilities and Exposures, a public ID for a security vulnerability. ChatAFL requested CVE IDs for its confirmed Live555 and ProFTPD bugs.", ex: "" },
  { id: "zero-day", term: "Zero-day / previously unknown bug", paper: "core",
    def: "A vulnerability the developers did not know about before. FOX found 8, ChatAFL 9, Fuzz4All 64 confirmed previously unknown.", ex: "" },
  { id: "responsible-disclosure", term: "Responsible disclosure", paper: "core",
    def: "Reporting bugs privately to vendors so they can fix them before details are public. FOX 'responsibly disclosed' its eight new bugs.", ex: "" },
  { id: "uaf", term: "Use-after-free (CWE-416)", paper: "core",
    def: "Using memory after it was freed. The freed memory may be reused by an attacker, which can lead to remote code execution. ChatAFL's bug #1 is a heap UAF in Live555 triggered by SETUP→PLAY→PAUSE→PLAY.", ex: "" },
  { id: "bof", term: "Heap buffer overflow", paper: "core",
    def: "Writing or reading past the end of a heap allocation. Classic RCE primitive. ChatAFL found one in ProFTPD's FTP command parsing.", ex: "" },
  { id: "uar", term: "Use-after-return", paper: "core",
    def: "Using a pointer to a function's stack frame after the function returned. ChatAFL found two in Live555 (DESCRIBE and SETUP handling).", ex: "" },
  { id: "memleak", term: "Memory leak", paper: "core",
    def: "Allocated memory that is never freed. Repeated leaks can exhaust memory (denial of service). ChatAFL found leaks in Live555 and Kamailio.", ex: "" },
  { id: "invalid-free", term: "Invalid free (CWE-761)", paper: "core",
    def: "Freeing a pointer that does not point to the start of a heap block. FOX+D found 3.", ex: "" },
  { id: "assertion", term: "Reachable assertion (CWE-617)", paper: "core",
    def: "An assert() that an input can make fail, crashing the program. FOX+D found 12. In Fuzz4All, internal compiler assertion failures count as bugs.", ex: "" },
  { id: "null-deref", term: "NULL pointer dereference (CWE-476)", paper: "core",
    def: "Reading or writing through a NULL pointer, which crashes the process. FOX+D found 2. Fuzz4All's Go bug runtime.ReadMemStats(nil) is the same idea: a nil input causes a segmentation violation.", ex: "" },
  { id: "inf-loop", term: "Infinite loop (CWE-835)", paper: "core",
    def: "A loop with an unreachable exit condition, which hangs the program (denial of service). FOX+D found 1.", ex: "" },
  { id: "ice", term: "Internal compiler error (ICE)", paper: "core",
    def: "The compiler itself crashes or fails an internal assertion while compiling code. It is the main bug type Fuzz4All found in GCC and Clang.", ex: "" },
  { id: "rce", term: "Remote code execution (RCE)", paper: "core",
    def: "An attacker runs their own code on a machine over the network. Memory-safety bugs in internet-facing protocol servers are especially dangerous because they can lead to RCE.", ex: "" },

  // ---------------- FOX ----------------
  { id: "fox", term: "FOX", paper: "fox",
    def: "'Coverage-guided Fuzzing as Online Stochastic Control' (CCS'24, She, Storek, Xie, Kweon, Srivastava, Jana). It reformulates fuzzing as a stochastic control problem. A branch-distance-based scheduler picks frontier branches, and a Newton's-method mutator flips them.", ex: "" },
  { id: "online-opt", term: "Online optimization", paper: "fox",
    def: "Optimization where you must choose actions one at a time and only see the result of each action after you take it. Fuzzing is online because cov(·) is only observed after a mutant is executed.", ex: "" },
  { id: "stochastic-control", term: "Stochastic optimal control", paper: "fox",
    def: "Choosing a sequence of control actions to maximize an objective when the system's dynamics are random. In FOX the state is the seed corpus S_i, the control is the seed index u_i, the dynamics are the random mutator plus the program, the objective is Σ g_i, and the constraint is Σ t_i ≤ T.", ex: "" },
  { id: "state-space", term: "State space (FOX)", paper: "fox",
    def: "All possible states of the system. For FOX it is the current seed corpus S_i at stage i.", ex: "" },
  { id: "control-space", term: "Control space (FOX)", paper: "fox",
    def: "All possible decisions. In FOX it is which seed to pick (index u_i with 1 ≤ u_i ≤ |S_i|). FOX shrinks it by scheduling frontier branches instead of seeds: 49.18% smaller at 12h and 58.20% smaller at 24h than AFL++, and up to 7× smaller on readelf.", ex: "" },
  { id: "stage", term: "Stage", paper: "fox",
    def: "One scheduling step of the control process: choose a seed, mutate, execute, update the corpus. The objective sums expected coverage gain over K stages.", ex: "" },
  { id: "frontier-node", term: "Frontier node", paper: "fox",
    def: "A visited node that has an edge to an unvisited node: F = {v | (v,u) ∈ E, v ∈ V, u ∈ U}. FOX keeps only frontier nodes that end in a conditional jump.", ex: "" },
  { id: "frontier-branch", term: "Frontier branch", paper: "fox",
    def: "A conditional branch that has been reached but has at least one outgoing edge never taken. Flipping it gives new coverage. FOX applies fine-grained feedback only to these, which avoids state explosion.", ex: "if (x <= 15) where every input so far had x ≤ 15." },
  { id: "horizon-node", term: "Horizon node (K-Scheduler)", paper: "fox",
    def: "From She et al.'s K-Scheduler (S&P'22): unvisited nodes on the boundary between visited and unvisited code. FOX's frontier nodes are the visited side of that boundary.", ex: "" },
  { id: "flip", term: "Flipping a branch", paper: "fox",
    def: "Finding an input x′ that makes a branch predicate evaluate differently from before: Q_b(f_b(x′)) ≠ Q_b(f_b(x)). This exercises the other outgoing edge.", ex: "" },
  { id: "branch-distance", term: "Branch distance δ_b", paper: "fox",
    def: "A linear or piece-wise linear function of the comparison's operands that says how close an input is to flipping the branch. It is chosen from Table 1 by the pair (current truth value, comparison type), so that driving it to zero or below flips the branch. For integer CMPs the raw value is op1 − op2. For strings it is a per-byte array of differences.", ex: "if (x ≤ 15) with x = 5: δ = 1 − f(x) = 16 − x." },
  { id: "predicate", term: "Predicate Q_b and relation R_b", paper: "fox",
    def: "Each frontier branch evaluates f_b(x) R_b 0, with R_b ∈ {<, ≤, >, ≥, =, ≠}. FOX's instrumentation gives it the 2-tuple (Q_b(f_b(x)), R_b), i.e., the current truth value and the comparison type.", ex: "" },
  { id: "proxy", term: "Branch-distance decrease as a proxy", paper: "fox",
    def: "Every flip involves a decrease in branch distance, but not every decrease is a flip. So Pr(b flips) ≤ Pr(δ_b decreases). Decreases happen much more often, so FOX can estimate them and use them as an upper bound on the probability of new coverage.", ex: "" },
  { id: "linearity-exp", term: "Linearity of expectation", paper: "fox",
    def: "E[ΣX] = ΣE[X], whether or not the X are independent. FOX writes total coverage as a sum of 0/1 indicators (one per unseen branch), so expected gain = Σ Pr(b flips).", ex: "" },
  { id: "bernoulli", term: "Bernoulli random variable", paper: "fox",
    def: "A 0/1 variable that is 1 with probability p. FOX models 'branch b flips' as X ~ Bernoulli(Pr(b flips | mut(S_i[u_i]))) and 'δ_b decreases' as Y ~ Bernoulli(p′).", ex: "" },
  { id: "ts-map", term: "TS mapping", paper: "fox",
    def: "FOX keeps, for each frontier branch b, the seed TS[b].s with the lowest branch distance seen so far, and that distance TS[b].d. Scheduling a branch means mutating its TS seed.", ex: "" },
  { id: "pt-tt", term: "Productive time / total time (PT, TT)", paper: "fox",
    def: "Per frontier branch, TT = total time spent executing inputs that reach it and PT = time spent on inputs that lowered its global minimum branch distance. The estimate is Pr(δ_b decreases) = λ_b · PT(b)/TT(b). Using time instead of hit counts builds in the time-budget constraint.", ex: "" },
  { id: "decay", term: "Seed decay factor λ_b", paper: "fox",
    def: "A discount based on how many times the seed mapped to branch b has already been scheduled (counter SC). It stops FOX from picking the same seed over and over. In Algorithm 1 the score is log PT[b] − log TT[b] − log SC[TS[b].s].", ex: "" },
  { id: "log-prob", term: "Log-probability trick", paper: "fox",
    def: "FOX compares log-probabilities instead of probabilities to avoid numerical underflow when PT is tiny compared with TT × λ.", ex: "" },
  { id: "greedy-opt", term: "Theorem 1 (greedy optimality)", paper: "fox",
    def: "Given fixed branch-flip probabilities before each stage, a greedy schedule that maximizes expected coverage gain at every stage is optimal. The proof is an exchange argument: swapping the optimal schedule's first choice for the greedy one never lowers the total expected gain.", ex: "" },
  { id: "local-search", term: "Local search (FOX mutator)", paper: "fox",
    def: "Sample k = 1024 mutants in a small neighbourhood N(x) of the seed (havoc with fewer stacked mutations). From these, build a locally correct linear under-approximation of δ_b, i.e., a subgradient g.", ex: "" },
  { id: "subgradient", term: "Subgradient / linear under-approximator", paper: "fox",
    def: "A vector g with gᵀ·(x′ − x) ≤ δ(x′) − δ(x) for all x′ in N(x): a line that never goes above the function nearby. FOX estimates it as the g′ = (δ(x′) − δ(x)) ⊘ (x′ − x) with the largest L1 norm. Under-approximating, rather than averaging, keeps Newton's method stable.", ex: "" },
  { id: "newton", term: "Newton's method (root finding)", paper: "fox",
    def: "Jump straight to where the linear model hits zero: x_new = x − δ_b(x) ⊘ g. If δ_b is linear and the branch is feasible, one step flips the branch. If δ_b is convex and well-behaved, the step still tends to reduce the distance.", ex: "δ = 16 − x at x = 5, g = −1 → x_new = 5 − 11/(−1) = 16. Flipped." },
  { id: "convex", term: "Convex / non-convex branch", paper: "fox",
    def: "Convex: δ curves like a bowl, so following the slope leads toward the root. Non-convex: jagged, like checksums, hash functions and complex string operations, where Newton's method struggles. FOX's limitations section names this explicitly.", ex: "" },
  { id: "midpoint", term: "Midpoint convexity check", paper: "fox",
    def: "FOX's cheap estimate of convexity: two inputs a, b are midpoint convex if δ((a+b)/2) ≤ (δ(a) + δ(b))/2. The ratio of passed checks to branch reaches gives a convexity score. Logistic regression shows it correlates positively with FOX flipping success (McFadden pseudo-R² = 0.048).", ex: "" },
  { id: "hot-bytes", term: "Hot bytes", paper: "fox",
    def: "Input bytes that directly influence a byte of a string comparison. FOX applies one byte-difference at a time to see which changes the branch distance. Because hot bytes for a string compare are usually adjacent, finding one plus the string length gives the rest, without probing every byte.", ex: "" },
  { id: "adaptive-switch", term: "Adaptive switch (hooks)", paper: "fox",
    def: "FOX's hook functions compute branch distances only for frontier branches and switch off once a branch is fully explored. This keeps runtime overhead small, and on some targets FOX even runs more executions than AFL++.", ex: "" },
  { id: "pathological", term: "Pathological (infeasible) branch", paper: "fox",
    def: "A branch where the mutator keeps lowering the distance but never flips it, which suggests it may be impossible to flip. FOX plans aggressive re-weighting to deprioritize these.", ex: "" },

  // ---------------- ChatAFL ----------------
  { id: "chatafl", term: "ChatAFL", paper: "chat",
    def: "'Large Language Model guided Protocol Fuzzing' (NDSS'24, Meng, Mirchev, Böhme, Roychoudhury). Built into AFLNet. It asks an LLM for message grammars, enriches seeds with missing message types, and asks for the next message when coverage plateaus.", ex: "" },
  { id: "protocol", term: "Network protocol", paper: "chat",
    def: "An agreed structure and order of messages between machines. Most internet protocols are specified in RFCs written in natural language, often hundreds of pages long.", ex: "" },
  { id: "rfc", term: "RFC (Request for Comments)", paper: "chat",
    def: "IETF documents specifying internet protocols in natural language. RTSP 1.0 is RFC 2326 (92 pages). ChatAFL's insight is that LLMs have read these RFCs during training.", ex: "" },
  { id: "rtsp", term: "RTSP", paper: "chat",
    def: "Real Time Streaming Protocol, a text-based protocol for controlling media streams (PLAY, PAUSE, SETUP…). Live555 implements it and is ChatAFL's case-study subject.", ex: "" },
  { id: "stateful", term: "Stateful system", paper: "chat",
    def: "A system whose response depends on earlier messages, not just the current one. 'The same input executed twice might give different outputs.' You need the right messages in the right order to reach deep states.", ex: "PLAY only works after SETUP." },
  { id: "state-machine", term: "Protocol state machine", paper: "chat",
    def: "States plus the messages that move between them. RTSP: INIT → (SETUP/ANNOUNCE) → READY → (PLAY) → PLAY, or (RECORD) → RECORD; PAUSE returns to READY; TEARDOWN returns to INIT.", ex: "" },
  { id: "response-code", term: "Response code as state", paper: "chat",
    def: "AFLNet (and ChatAFL) identify the server's state by parsing the response code (e.g., 200, 454). With no ground-truth state machine, a 'state' is a unique response code, and state coverage counts these.", ex: "" },
  { id: "state-transition", term: "State transition coverage", paper: "chat",
    def: "How many distinct (state → state) moves the fuzzer exercised. ChatAFL covers 47.60% more transitions than AFLNet and 42.69% more than NSFuzz.", ex: "" },
  { id: "aflnet", term: "AFLNet", paper: "chat",
    def: "The popular mutation-based, code- and state-guided protocol fuzzer (Pham, Böhme, Roychoudhury). It fuzzes recorded message sequences and infers a state machine from response codes. ChatAFL is built on top of it, so every difference is due to the LLM guidance.", ex: "" },
  { id: "nsfuzz", term: "NSFuzz(-v)", paper: "chat",
    def: "Extends AFLNet by finding state variables with static analysis and using their values as feedback. SGFuzz has a similar idea (implemented in LibFuzzer). ChatAFL's second baseline.", ex: "" },
  { id: "empf", term: "EMPF vs LLMPF", paper: "chat",
    def: "EMPF = existing mutation-based protocol fuzzing (Algorithm 1 without gray text). LLMPF = LLM-guided protocol fuzzing (with the gray additions: grammar, enrichment, plateau handler).", ex: "" },
  { id: "m1m2m3", term: "M1, M2, M3 split", paper: "chat",
    def: "AFLNet splits a chosen message sequence M into M1 (the prefix that drives the server to state s), M2 (the part to mutate), and M3 (the rest). Only M2 is changed.", ex: "" },
  { id: "grammar", term: "Message grammar", paper: "chat",
    def: "A machine-readable template of a message type: immutable keywords plus mutable regions marked <Value>. ChatAFL asks the LLM for it once before fuzzing and stores it in a map G = {type → grammar}.", ex: "PLAY: {PLAY <Value> RTSP/1.0\\r\\n, CSeq: <Value>\\r\\n, …}" },
  { id: "structure-aware", term: "Structure-aware mutation", paper: "chat",
    def: "Mutating only the <Value> regions a grammar marks as mutable, so messages stay well-formed and get past the parser. ChatAFL still keeps the structure-unaware random mutation as a lower-probability branch, to explore corner cases.", ex: "" },
  { id: "few-shot", term: "In-context few-shot learning", paper: "chat",
    def: "Putting a few input→output examples in the prompt so the LLM copies the format. ChatAFL gives two 'shots' (RTSP PLAY, HTTP GET) to get grammars in a parseable format. Two shots, not one, so the LLM doesn't copy the single example too literally.", ex: "" },
  { id: "self-consistency", term: "Self-consistency check", paper: "chat",
    def: "Ask the same question several times and take the majority answer. ChatAFL repeats grammar extraction five times, which filters rare hallucinated message types such as 'SET DESCRIPTION'.", ex: "" },
  { id: "seed-enrichment", term: "Seed enrichment", paper: "chat",
    def: "MissingTypes = AllTypes − ExistingTypes. The LLM is asked to insert missing message types (two at a time) at the right places in an existing seed sequence. Real seeds carry context such as session IDs that the LLM can copy.", ex: "Adding PAUSE to the Live555 seeds made bug #1 reachable." },
  { id: "plateaulen", term: "PlateauLen / MaxPlateau", paper: "chat",
    def: "PlateauLen counts consecutive uninteresting inputs. It resets on a crash or new coverage. When it exceeds MaxPlateau (512 in the paper, about 10 minutes), ChatAFL asks the LLM for the next message. The maximum number of ineffective prompts is a quarter of MaxPlateau.", ex: "" },
  { id: "temperature", term: "LLM temperature", paper: "chat",
    def: "Controls randomness of sampling. Low means focused and factual, high means diverse. ChatAFL uses 0.5 for grammar extraction and seed enrichment and 1.5 to break plateaus. Fuzz4All uses 0 (greedy) and 1 for autoprompting and 1 for generation.", ex: "" },
  { id: "session-id", term: "Session ID problem", paper: "chat",
    def: "The server assigns a session ID at runtime, so the LLM cannot know it. In the case study 24.5% of generated requests failed with session mismatch. The fix was to include server responses or real seed messages in the prompt so the LLM copies the right value.", ex: "" },
  { id: "cl0-3", term: "CL0–CL3 (ChatAFL ablation)", paper: "chat",
    def: "CL0 = AFLNet. CL1 = +grammar-guided mutation (SA). CL2 = +SA +seed enrichment (SB). CL3 = all three, i.e., ChatAFL (adds plateau handler SC). Branch gains 3.04% → 3.86% → 5.9%, and the same coverage is reached 2.0×, 4.6×, 6.1× faster.", ex: "" },

  // ---------------- Fuzz4All ----------------
  { id: "fuzz4all", term: "Fuzz4All", paper: "f4a",
    def: "'Universal Fuzzing with Large Language Models' (ICSE'24, Xia, Paltenghi, Tian, Pradel, Zhang). It uses LLMs as the input generation and mutation engine, so one fuzzer works on many languages and features. Two parts: autoprompting and an LLM-powered fuzzing loop.", ex: "" },
  { id: "universal", term: "Universal fuzzer", paper: "f4a",
    def: "A fuzzer that can target many input languages and many features of those languages. Fuzz4All covers C, C++, Go, SMT2, Java and Python (Qiskit) with the same 872-line core.", ex: "" },
  { id: "llm", term: "Large Language Model (LLM)", paper: "f4a",
    def: "A transformer neural network pre-trained on huge text/code corpora that predicts the next token. Decoder-only (GPT, StarCoder), encoder-only (BERT, CodeBERT), or encoder-decoder (BART, CodeT5).", ex: "" },
  { id: "prompt", term: "Prompt / prompt engineering", paper: "f4a",
    def: "The input text given to an LLM. Prompt engineering is trying instructions until one works, which is manual and slow. Fuzz4All automates it with autoprompting.", ex: "" },
  { id: "finetune", term: "Fine-tuning vs prompting", paper: "f4a",
    def: "Fine-tuning updates model weights on a task dataset (expensive, needs data). Prompting leaves weights alone and describes the task in text. Fuzz4All only prompts.", ex: "" },
  { id: "autoprompting", term: "Autoprompting", paper: "f4a",
    def: "Fuzz4All's first stage. A distillation LLM (GPT-4) summarizes arbitrary user input (docs, examples, specs) into candidate prompts: one greedy (temperature 0), the rest sampled at temperature 1, four in total. Each candidate generates 30 snippets and is scored by how many unique snippets are valid. The best becomes the input prompt. It needs only black-box sampling, no model gradients.", ex: "" },
  { id: "distill-llm", term: "Distillation LLM (M_D)", paper: "f4a",
    def: "The large, strong model (GPT-4, gpt-4-0613, max_token 500) used once to condense user input into a prompt. It is too expensive to use for every fuzzing input.", ex: "" },
  { id: "gen-llm", term: "Generation LLM (M_G)", paper: "f4a",
    def: "The smaller, cheaper model (StarCoder, trained on 1T+ code tokens in 80+ languages) that produces the fuzzing inputs. Settings: temperature 1, batch 30, max length 1,024, nucleus sampling with top-p 1.", ex: "" },
  { id: "scoring", term: "Scoring function", paper: "f4a",
    def: "Ranks candidate prompts: Σ_{c ∈ M_G(p)} isValid(c, SUT), the number of unique generated snippets the SUT accepts. Chosen because it is lightweight and general and because valid inputs reach deep logic.", ex: "" },
  { id: "fuzz-loop", term: "LLM-powered fuzzing loop", paper: "f4a",
    def: "Fuzz4All's second stage (Algorithm 2). Each iteration builds a prompt from the input prompt, a randomly picked valid example from the last batch, and a randomly chosen generation strategy. It generates a batch, then runs the oracle. The changing prompt avoids repeated outputs.", ex: "" },
  { id: "gen-strats", term: "Generation strategies", paper: "f4a",
    def: "generate-new ('create a program which uses complex …'), mutate-existing ('create a mutated program that modifies the previous generation'), semantic-equiv ('create a semantically equivalent program to the previous generation'). They mimic generation-based and mutation-based fuzzers.", ex: "" },
  { id: "validity", term: "Validity rate (% valid)", paper: "f4a",
    def: "Percentage of generated inputs that are valid and unique, e.g., compile successfully. Fuzz4All's validity is lower than baselines (56.0% average reduction) yet coverage is higher, because diversity matters more and near-valid inputs exercise validation logic.", ex: "" },
  { id: "hit-rate", term: "Hit rate (targeted fuzzing)", paper: "f4a",
    def: "Percentage of generated inputs that use a specific target feature (checked with a regex). Targeted Fuzz4All averages 83.0%. General fuzzing has a 96.0% lower hit rate on average.", ex: "" },
  { id: "targeted", term: "Targeted fuzzing", paper: "f4a",
    def: "Focusing generation on a chosen feature by giving documentation of just that feature (e.g., C++23 std::expected). Valuable for testing new features that are rare in LLM training data.", ex: "" },
  { id: "smt", term: "SMT solver / SMT2", paper: "f4a",
    def: "Satisfiability Modulo Theories solvers (Z3, CVC5) decide if logical formulas are satisfiable. SMT-LIB2 is their input language. A Fuzz4All input is valid if the solver answers SAT or UNSAT without error.", ex: "(declare-const x Int) (assert (= x 1)) (check-sat)" },
  { id: "qiskit", term: "Qiskit", paper: "f4a",
    def: "IBM's Python quantum computing framework. Fuzz4All runs generated Python programs, collects every QuantumCircuit, transpiles each at different optimization levels, and does a QASM export/import round trip. Coverage was +75.6% over MorphQ.", ex: "" },
  { id: "data-shift", term: "Data shift", paper: "f4a",
    def: "A model trained on yesterday's code gets less effective as languages evolve. Fuzz4All mitigates it by feeding up-to-date documentation through autoprompting.", ex: "" },
  { id: "hallucination", term: "Hallucination", paper: "f4a",
    def: "When an LLM produces made-up or inaccurate content. Threat for Fuzz4All's distillation step. For ChatAFL it shows up as invented message types like 'SET DESCRIPTION', handled by self-consistency.", ex: "" },
  { id: "nucleus", term: "Nucleus (top-p) sampling", paper: "f4a",
    def: "Sample the next token only from the smallest set whose probabilities add up to p. With top-p = 1, as in Fuzz4All, the full distribution is used.", ex: "" },
  { id: "differential", term: "Differential testing", paper: "f4a",
    def: "An oracle that compares two implementations or configurations (e.g., -O0 vs -O2) and flags disagreements. Fuzz4All's Qiskit oracle transpiles at different optimization levels.", ex: "" }
];

FL.CHAPTERS.push({
  id: "boot", num: "0", color: "var(--boot)", title: "Bootcamp", venue: "Fuzzing 101",
  blurb: "Learn the vocabulary every examiner expects: seeds, mutation, coverage, oracles and how fuzzers are evaluated.",
  steps: [
    { id: "b-welcome", type: "scene", title: "Day one at the lab",
      setting: "A security research lab, 9:02 a.m. Three PDFs on your desk.",
      lines: [
        { who: "narr", text: "You arrive for your first day. Ada, the lab's guide, has printed three papers and stacked them by your keyboard." },
        { who: "ada", text: "Welcome. These three papers are your world for the next weeks: FOX from CCS 2024, ChatAFL from NDSS 2024, and Fuzz4All from ICSE 2024." },
        { who: "me", text: "They're all about… fuzzing?" },
        { who: "ada", text: "All three. Each one attacks a different weakness of today's fuzzers. FOX makes the core loop smarter with control theory. ChatAFL uses an LLM to understand network protocols. Fuzz4All uses an LLM to write test programs in any language." },
        { who: "ada", text: "Before you meet the researchers, you need their vocabulary. If you can explain these words cleanly, the doctor's questions stop being scary." },
        { who: "me", text: "Then let's break some things on purpose." }
      ] },

    { id: "b-what", type: "lesson", title: "What fuzzing actually is",
      html: `
<p><span class="t" data-g="fuzzing">Fuzzing</span> is automated testing: you generate a huge number of inputs, run each one against the target program, and watch for unexpected behaviour. FOX defines it as <em>"generating random test inputs and executing them against the target program."</em></p>
<p>The program being tested is the <span class="t" data-g="sut">SUT</span>, the system under test. The rule that says "this run is a bug" is the <span class="t" data-g="oracle">oracle</span>. The simplest oracle is a crash. Real campaigns also compile the target with <span class="t" data-g="asan">AddressSanitizer</span>, which turns silent memory corruption into a loud crash with a stack trace.</p>
<h4>Why security people care</h4>
<p>Many crashes are memory-safety bugs: <span class="t" data-g="uaf">use-after-free</span>, <span class="t" data-g="bof">buffer overflows</span>, <span class="t" data-g="null-deref">NULL dereferences</span>. An attacker who controls the input can sometimes turn one into <span class="t" data-g="rce">remote code execution</span>. Fuzzing finds these bugs before attackers do.</p>
<h4>How much the fuzzer can see</h4>
<ul>
<li><span class="t" data-g="blackbox">Blackbox</span>: sees only outputs. Fuzz4All needs no instrumentation of the SUT.</li>
<li><span class="t" data-g="greybox">Greybox</span>: gets cheap coverage feedback from compiled-in <span class="t" data-g="instrumentation">instrumentation</span>. AFL++, FOX, AFLNet and ChatAFL work this way.</li>
<li><span class="t" data-g="whitebox">Whitebox</span>: heavy analysis such as symbolic execution or taint tracking. Precise, but slow.</li>
</ul>
<div class="callout say">"Fuzzing is automated, large-scale input generation with an oracle such as crashes or sanitizer reports. Greybox fuzzers use coverage feedback to decide which inputs are worth keeping."</div>` },

    { id: "b-two", type: "lesson", title: "Two families: mutate or generate",
      html: `
<p>Every fuzzer in these papers belongs to one of two families, or mixes them.</p>
<div class="grid2 collapse">
 <div class="callout"><b>Mutation-based</b><br>Start from <span class="t" data-g="seed">seeds</span> (real inputs), apply small <span class="t" data-g="mutation">mutations</span> such as bit flips, byte swaps or splicing. Needs no spec. Limited by seed quality and by how dumb the mutations are.<br><span class="small muted">AFL++, AFLNet, NSFuzz, GrayC, FOX, ChatAFL</span></div>
 <div class="callout"><b>Generation-based</b><br>Build inputs from scratch using a grammar or a hand-written model. Inputs are valid, but someone has to write and maintain the generator.<br><span class="small muted">Csmith (more than 80k LoC), YARPGen, Peach, BooFuzz</span></div>
</div>
<p>AFL++ has a stage called <span class="t" data-g="havoc">havoc</span>, which stacks several random mutations at once. Remember that word, because FOX reuses havoc inside its local search.</p>
<div class="callout trap">Don't say "Fuzz4All is mutation-based" or "generation-based" alone. Its loop does both: the <em>generate-new</em> strategy acts like a generator, and <em>mutate-existing</em> and <em>semantic-equiv</em> act like mutators. The LLM is the engine for both.</div>` },

    { id: "b-lab", type: "sim", title: "Mutation Lab", game: "mutationLab",
      intro: "A tiny parser crashes only on input that starts with \"BUG!\". Try to reach it by hand, then let the fuzzer run, first blind and then coverage-guided. Watch how keeping 'interesting' inputs changes everything." },

    { id: "b-cov", type: "lesson", title: "Coverage: the fuzzer's sense of smell",
      html: `
<p>A program is a <span class="t" data-g="cfg">control-flow graph</span>. Nodes are <span class="t" data-g="basic-block">basic blocks</span> (straight-line code) and edges are the jumps between them. Instrumentation marks every edge an input executes in a shared-memory <span class="t" data-g="bitmap">bitmap</span>.</p>
<p><span class="t" data-g="coverage-guided">Coverage-guided fuzzing</span> keeps any mutant that lights up a new edge. That is why the guided run in the Mutation Lab cracks "BUG!" quickly and the blind run doesn't: each correct byte is rewarded as soon as it appears.</p>
<div class="kv panel">
 <span>Edge coverage</span><b>FOX reports "edges found"</b>
 <span>Branch coverage</span><b>ChatAFL (via ProFuzzBench tools)</b>
 <span>Line coverage</span><b>Fuzz4All (uniform across languages)</b>
 <span>State coverage</span><b>ChatAFL: unique server response codes</b>
</div>
<p>Coverage is a <em>proxy</em>. You can't find a bug in code you never ran. FOX cites a strong link between coverage and bugs and measures a Pearson correlation of <b>0.88</b> between edges and unique crashes on xpdf. ChatAFL states directly that "coverage is only a proxy measure for the bug-finding ability," which is why every paper also counts real bugs.</p>
<p>Eventually the fuzzer stops finding anything new. That is a <span class="t" data-g="plateau">coverage plateau</span>. ChatAFL calls an LLM when it hits one.</p>` },

    { id: "b-loop", type: "lesson", title: "Inside the loop: scheduler, mutator, energy",
      html: `
<p>Zoom into one iteration of a greybox fuzzer:</p>
<ol>
<li><b><span class="t" data-g="scheduler">Scheduler</span></b>: which seed from the <span class="t" data-g="corpus">corpus</span> do I mutate next?</li>
<li><b><span class="t" data-g="energy">Energy</span></b>: how many mutants do I make from it?</li>
<li><b>Mutator</b>: how exactly do I change it?</li>
<li><b>Execute + feedback</b>: did it crash? Did it reach new coverage? If so, add it to the corpus.</li>
</ol>
<p>Two AFL++ add-ons show up again and again as baselines:</p>
<ul>
<li><span class="t" data-g="cmplog">cmplog</span> (AFLPP+C): reads the operands of comparisons and copies magic values into the input. It is the industry version of <span class="t" data-g="redqueen">REDQUEEN</span>.</li>
<li><span class="t" data-g="dictionary">Dictionary</span> (+D): a list of constants and tokens the mutator may insert. AFLPP+CD (cmplog plus dictionary) is AFL++'s strongest setting.</li>
</ul>
<div class="callout story">FOX argues these four pieces usually act like strangers. The scheduler and the mutator have "distinct objectives and little information exchange" even though both want the same thing: new coverage. Fixing that is the heart of Chapter 1.</div>` },

    { id: "b-eval", type: "lesson", title: "How researchers prove a fuzzer is better",
      html: `
<p>Fuzzing is random, so one lucky run proves nothing. All three papers follow the <span class="t" data-g="klees">Klees et al.</span> playbook:</p>
<ul>
<li><b>Repeat</b>: FOX 10 × 24h per fuzzer and program (more than 6 CPU-years in total). ChatAFL 10 × 24h. Fuzz4All 5 × 24h.</li>
<li><b>Test significance</b>: the <span class="t" data-g="mwu">Mann-Whitney U test</span> (non-parametric, p &lt; 0.05). ChatAFL also reports the effect size <span class="t" data-g="a12">Â12</span>.</li>
<li><b>Benchmarks</b>: <span class="t" data-g="fuzzbench">FuzzBench</span> (coverage), <span class="t" data-g="magma">Magma</span> (known injected bugs), <span class="t" data-g="profuzzbench">ProFuzzBench</span> (protocol servers).</li>
<li><b><span class="t" data-g="ablation">Ablation</span></b>: switch components off to show each one matters.</li>
<li><b>Real bugs</b>: <span class="t" data-g="crash-dedup">deduplicate crashes</span>, confirm with developers, request a <span class="t" data-g="cve">CVE</span>, and follow <span class="t" data-g="responsible-disclosure">responsible disclosure</span>.</li>
</ul>
<div class="callout say">"Mann-Whitney U is used because fuzzing results aren't normally distributed. It's non-parametric and makes no distribution assumption. Â12 tells you how likely a random run of tool A beats a random run of tool B."</div>` },

    { id: "b-bugs", type: "lesson", title: "The bug zoo you'll meet",
      html: `
<div class="scrollx"><table class="data">
<tr><th>Bug class</th><th>CWE</th><th>Who found it here</th></tr>
<tr><td>Use-after-free</td><td>416</td><td>FOX+D (2), ChatAFL (Live555 PLAY, SETUP, sendDataOverTCP)</td></tr>
<tr><td>Invalid free</td><td>761</td><td>FOX+D (3)</td></tr>
<tr><td>Reachable assertion</td><td>617</td><td>FOX+D (12), Fuzz4All (compiler assertions)</td></tr>
<tr><td>Infinite loop</td><td>835</td><td>FOX+D (1)</td></tr>
<tr><td>NULL dereference</td><td>476</td><td>FOX+D (2), Fuzz4All (Go nil)</td></tr>
<tr><td>Heap buffer overflow</td><td>122</td><td>ChatAFL (Live555 stream, ProFTPD commands)</td></tr>
<tr><td>Use-after-return</td><td>562</td><td>ChatAFL (Live555 DESCRIBE, SETUP)</td></tr>
<tr><td>Memory leak</td><td>401</td><td>ChatAFL (Live555, Kamailio)</td></tr>
<tr><td>Internal compiler error</td><td>n/a</td><td>Fuzz4All (GCC, Clang)</td></tr>
</table></div>
<p class="small muted">The CWE numbers for the first five come from FOX's paper. The others are the standard CWE IDs for those bug classes.</p>` },

    { id: "b-quiz", type: "quiz", title: "Bootcamp checkpoint",
      qs: [
        { q: "What makes a fuzzer 'greybox'?", options: ["It reads the source code and solves constraints", "It uses lightweight runtime feedback such as edge coverage from instrumentation", "It only sees the program's outputs", "It uses a GPU"], a: 1, why: "Greybox means cheap feedback such as coverage bitmaps, with no heavy analysis. Whitebox uses symbolic execution or taint. Blackbox sees outputs only." },
        { q: "In coverage-guided fuzzing, when is a mutant added to the corpus?", options: ["Always", "When it crashes", "When it reaches coverage no previous input reached", "When it is shorter than the seed"], a: 2, why: "New coverage makes an input 'interesting'. Crashes are saved separately as bug reports." },
        { q: "Why do fuzzing papers use the Mann-Whitney U test?", options: ["It is the fastest test", "Fuzzing results are random and not normally distributed, and MWU is non-parametric", "It measures code coverage", "Reviewers require t-tests"], a: 1, why: "FOX: 'Since this test is non-parametric and therefore does not make any assumptions about the underlying distribution, it has been widely used… for testing randomized algorithms and fuzzers.'" },
        { q: "AFL++ 'cmplog' mode is an industry implementation of…", options: ["NEUZZ", "REDQUEEN (input-to-state correspondence)", "Angora", "KLEE"], a: 1, why: "FOX: AFLPP+C is 'an industry implementation of REDQUEEN'. It intercepts CMP operands and applies tailored mutations." },
        { q: "What does an ablation study show?", options: ["How fast the fuzzer is", "How much each component contributes, by turning components off", "Which bugs are CVEs", "The statistical significance"], a: 1, why: "FOX (BASE/SCHED/FULL), ChatAFL (CL0–CL3) and Fuzz4All (prompt and loop variants) all run ablations." },
        { q: "Which oracle catches a heap use-after-free that would otherwise not crash?", options: ["Coverage bitmap", "AddressSanitizer", "Mann-Whitney U", "Dictionary"], a: 1, why: "ASAN instruments memory accesses and reports UAF, overflows and leaks with stack traces. ChatAFL uses ASAN stack traces to tell bugs apart." }
      ] }
  ]
});
